apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: civic-research-and-claim-map
  namespace: civic-action
  labels: {category: civic-evidence, idempotent: "true"}
  annotations: {research: docs/research/control-source-matrix.md, boundary: evidence-preparation-only}
spec:
