apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: dataset-export
  namespace: dataset-intelligence
  labels: {category: exchange, idempotent: "true"}
  annotations: {boundary: shared-aiwg-dataset-runtime-only, operation: aiwg-dataset-export}
spec:
  description: Delegate an authorized versioned standards export to aiwg dataset export and preserve mapping coverage and loss-report evidence.
  version: 1.0.0
  inputs:
    - {name: dataset_ref, type: string, required: true}
    - {name: profile, type: string, required: true}
    - {name: approval_ref, type: string, required: false}
  outputs:
    - {name: export_ref, type: string}
    - {name: loss_report_ref, type: string}
  agent: dataset-provenance-reviewer
  idempotent: true
