apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: dataset-source-assess
  namespace: dataset-intelligence
  labels: {category: assessment, idempotent: "true"}
  annotations: {boundary: declarative-aiwg-dataset-delegation, operation: aiwg-dataset-source-check-and-preview}
spec:
  description: Review bounded aiwg dataset check and preview evidence without mutation, credential-value access, or shadow connector execution.
  version: 1.0.0
  inputs: [{name: intake_ref, type: string, required: true}]
  outputs: [{name: assessment_ref, type: string}]
  agent: dataset-source-architect
  idempotent: true
