# Release Configuration Schema
#
# Consumed by the `flow-release` skill (#1266 follow-up). Lives at
# `.aiwg/release.config` in each project; the skill reads it to know which
# gates to run, in what order, and what hard-stops vs warn-only.
#
# The shipped AIWG reference implementation lives at
# `schemas/flows/examples/aiwg.release.config.yaml`. AIWG's active project
# copy is `.aiwg/release.config` (which may resolve to an external artifact
# root through `.aiwg-location`).

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://aiwg.io/schemas/release-config/v1"
title: "AIWG Release Configuration"
description: |
  Project-specific release rules for the flow-release skill. The skill walks
  the `gates` array in order, executes each gate's steps or sub-actions,
  enforces hard_stop semantics, and applies the policy reminders at every
  step.

type: object
required:
  - version
  - project
  - version_policy
  - gates
properties:
  version:
    type: integer
    const: 1
    description: Schema version. Bumped only on incompatible changes.

  project:
    type: object
    required: [name]
    properties:
      name:
        type: string
        description: Canonical project name (matches package.json name).
      display_name:
        type: string
      repo_url:
        type: string
        format: uri
      mirror_url:
        type: string
        format: uri
        description: Optional public-mirror URL (e.g., GitHub) for cross-tracker imports.
      npm_package:
        type: string
        description: npm package name when applicable.

  version_policy:
    type: object
    required: [format, channels]
    properties:
      format:
        type: string
        enum: [calver, semver]
        description: |
          calver: `YYYY.M.PATCH` with no leading zeros (enforced by the
          `versioning` rule). semver: standard MAJOR.MINOR.PATCH.
      pattern:
        type: string
        description: Display-only hint. Loader uses the rule for validation.
      tag_prefix:
        type: string
        default: v
      channels:
        type: object
        description: Per-channel release config (stable, rc, beta, alpha, nightly).
        additionalProperties:
          type: object
          properties:
            tag_format:
              type: string
              description: Template using {YYYY} {M} {PATCH} {N} {YYYYMMDD} placeholders.
            require_announcement:
              type: boolean
              default: false
            require_changelog:
              type: boolean
              default: false
            require_uat:
              type: boolean
              default: false

  gates:
    type: array
    description: |
      Ordered list of gates. Each gate has one of: `steps`, `invoke_skill`,
      `artifacts`, `review_diff`, or `actions`. `hard_stop: true` halts the
      flow on failure; false surfaces a warning and continues.
    items:
      type: object
      required: [name, hard_stop]
      properties:
        name:
          type: string
          description: Stable identifier — referenced in logs and audit trail.
        hard_stop:
          type: boolean
          default: true
        required_for_channels:
          type: array
          items:
            type: string
          description: Skip this gate when the target channel is not in this list.
        steps:
          type: array
          description: Shell commands to run sequentially.
          items:
            type: object
            anyOf:
              - required: [run]
              - required: [depends_on_channel]
            properties:
              id:
                type: string
              run:
                type: string
                description: Shell command. May contain {version} / {tag} / {channel} placeholders.
              expect_exit:
                type: integer
                default: 0
              tolerate_pre_existing_flakes:
                type: array
                items:
                  type: string
                description: Test paths whose failure is known and tolerated.
              required_for_channels:
                type: array
                items:
                  type: string
              skip_when_flag:
                type: string
                description: CLI flag that, when passed, skips this step.
              depends_on_channel:
                type: object
                description: Per-channel variant of the run command.
                additionalProperties:
                  type: string
        invoke_skill:
          type: string
          description: AIWG skill name to dispatch (e.g., `doc-sync`).
        args:
          type: object
          description: Arguments forwarded to the invoked skill.
        tracker:
          type: string
          enum: [gitea, github]
          description: For CI gates — which tracker hosts the actions runs.
        owner:
          type: string
        repo:
          type: string
        timeout_seconds:
          type: integer
          minimum: 60
        poll_interval_seconds:
          type: integer
          minimum: 5
        required_workflows:
          type: array
          items:
            type: string
        artifacts:
          type: array
          description: Files that must exist or contain a specific section.
          items:
            type: object
            required: [path]
            properties:
              path:
                type: string
              section_pattern:
                type: string
              must_exist:
                type: boolean
                default: true
        review_diff:
          type: object
          properties:
            path:
              type: string
            since_tag:
              type: string
            prompt:
              type: string
        actions:
          type: array
          description: Post-release hook actions.
          items:
            type: object
            properties:
              required_for_channels:
                type: array
                items: { type: string }
              skip_when_flag:
                type: string
              close_imported_issues_with_thanks:
                type: boolean
              update_release_entry:
                type: string
                enum: [gitea, github]
              create_github_announcement_discussion:
                type: object
                required: [category, links, style]
                properties:
                  category:
                    type: string
                    description: GitHub Discussions category name, normally Announcements.
                  required_for_channels:
                    type: array
                    items: { type: string }
                  hard_stop:
                    type: boolean
                    default: true
                  skip_when_flag:
                    type: string
                  links:
                    type: array
                    minItems: 4
                    maxItems: 4
                    uniqueItems: true
                    items:
                      type: string
                      enum: [github_release, npm_version, release_notes, changelog]
                    description: Release surfaces that must be linked from the discussion body.
                    allOf:
                      - contains: { const: github_release }
                      - contains: { const: npm_version }
                      - contains: { const: release_notes }
                      - contains: { const: changelog }
                  style:
                    type: string
                    enum: [conversational-impact-guidance]
                    description: Explain user impact and invite conversation instead of repeating release notes.
                  voice_sources:
                    type: array
                    items: { type: string }
                    description: Optional operator voice files; fall back to the named style when unavailable.
            additionalProperties: false

  policy:
    type: object
    description: Project-wide policy flags. These layer on top of the kernel rules.
    properties:
      no_ai_attribution:
        type: boolean
        default: true
      ci_green_before_done:
        type: boolean
        default: true
      preserve_pre_release_announcements:
        type: boolean
        default: false
      thank_external_reporters:
        type: boolean
        default: true

  publication_verify:
    type: object
    description: |
      Optional. Declares what "published" means for this project so the
      `release-publication-verify` skill can turn a tag into concrete proof
      across release surfaces. Absent surfaces are reported MISSING/N/A, not
      failed. `{version}` = tag without `v`; `{tag}` = full tag; `{owner}` /
      `{mirror}` resolve from the configured repos.
    properties:
      release_assets:
        type: array
        items: { type: string }
        description: Globs that MUST be attached to the release (e.g. "*.deb", "install.sh").
      checksums:
        type: object
        properties:
          manifest:
            type: string
            description: Checksum manifest asset name (e.g. "SHA256SUMS").
          must_cover:
            type: array
            items: { type: string }
            description: Globs the manifest must list and verify via `sha256sum -c`.
      ghcr_images:
        type: array
        description: Container images that must exist and pass a documented smoke command.
        items:
          type: object
          required: [image, tags]
          properties:
            image: { type: string, description: "e.g. ghcr.io/{owner}/aiwg" }
            tags:
              type: array
              items: { type: string }
              description: "Tags that must exist (e.g. {version}, latest)."
            smoke:
              type: string
              description: Documented command that must exit 0 (e.g. "--version").
      installer:
        type: object
        properties:
          url:
            type: string
            description: Installer URL template against the real release (e.g. ".../{tag}/install.sh").
          dry_run:
            type: string
            description: Dry-run command that must exit 0 (e.g. "sh install.sh --dry-run").
      platform_jobs:
        type: array
        description: Platform-specific evidence (e.g. host-direct smoke on a specific arch).
        items:
          type: object
          required: [name]
          properties:
            name: { type: string }
            evidence:
              type: string
              description: CI run reference or log path proving the platform job ran green.

additionalProperties: false
