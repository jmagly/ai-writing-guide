# Conversion (#1539) — flow-knowledge-transfer Step 2 panel member.
apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: ktransfer-doc-enhance
  labels: { domain: knowledge-transfer }
spec:
  description: Enhance documentation for newcomers — add context, clarify jargon, add examples/diagrams, build quick-reference guides, and produce a consolidated ordered reading list (.aiwg/knowledge/docs/enhanced/).
  version: "1.0.0"
  inputs:
    - { name: doc_inventory, type: string, required: true }
  outputs:
    - { name: enhanced_docs, type: array }
  agent: technical-writer
  idempotent: false
