# #1539 capability — flow-team-onboarding Step 5c.
apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: onboard-checkin-90
  labels: { domain: team }
spec:
  description: Conduct the 90-day graduation review — graduation criteria, final performance assessment, integration status, future development, and process feedback; produce the graduation assessment consumed by the graduation gate (Step 5c).
  version: "1.0.0"
  inputs:
    - { name: member_name, type: string, required: true }
  outputs:
    - { name: graduation_assessment, type: object }
  agent: project-manager
  idempotent: false
