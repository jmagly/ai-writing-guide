# #1539 conversion of flow-iteration-dual-track Step 6 (Complete iteration panel).
apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: dualtrack-complete-metrics
  labels: { domain: iteration }
spec:
  description: Calculate iteration N metrics — Delivery (velocity planned vs actual, completion rate, defect density, gate pass rate), Discovery (ready-backlog size, DoR compliance, lead time, refinement efficiency), and synchronization (handoff quality, idle/wait time, defect leakage).
  version: "1.0.0"
  inputs: []
  outputs:
    - { name: metrics_summary, type: string }
  agent: project-manager
  idempotent: true
