# #1539 capability — checklist panel reviewer: risk management (DoR).
apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: handoff-review-risk
  labels: { domain: handoff }
spec:
  description: Validate Definition-of-Ready risk criteria (high-risk assumptions validated, technical risks documented, dependencies resolved, no unmitigated blocking risks) with PASS/FAIL status and evidence per item.
  version: "1.0.0"
  inputs: []
  outputs:
    - { name: validation, type: string }
  agent: project-manager
  idempotent: true
