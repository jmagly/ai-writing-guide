# Conversion (#1539) capability for flow-compliance-validation Step 2 (panel).
apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: compliance-evidence-technical
  labels: { domain: compliance }
spec:
  description: Collect or document technical control evidence (encryption configs, access control/IAM/MFA, security monitoring/SIEM, network security) into the evidence repository, verifying currency and redacting sensitive data.
  version: "1.0.0"
  inputs: []
  outputs:
    - { name: technical_evidence, type: array }
  agent: security-architect
  idempotent: true
