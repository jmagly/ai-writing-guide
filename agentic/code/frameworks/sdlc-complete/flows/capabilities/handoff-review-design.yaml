# #1539 capability — checklist panel reviewer: design completeness (DoR).
apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: handoff-review-design
  labels: { domain: handoff }
spec:
  description: Validate Definition-of-Ready design criteria, including canonical cataloged schemas or reviewed opt-outs for every persistent/exchanged data element, fixtures, interface specifications, integration points, and compatibility evidence.
  version: "1.1.0"
  inputs: []
  outputs:
    - { name: validation, type: string }
  agent: architecture-designer
  idempotent: true
