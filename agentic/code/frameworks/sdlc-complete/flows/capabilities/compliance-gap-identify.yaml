# Conversion (#1539) capability for flow-compliance-validation Step 3 (panel).
apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: compliance-gap-identify
  labels: { domain: compliance }
spec:
  description: Identify compliance gaps by comparing implementation status and evidence sufficiency against the requirements matrix, categorizing each gap (missing/ineffective control or insufficient evidence) and assigning a severity (critical/high/medium/low).
  version: "1.0.0"
  inputs: []
  outputs:
    - { name: gap_analysis, type: object }
  agent: compliance-auditor
  idempotent: true
