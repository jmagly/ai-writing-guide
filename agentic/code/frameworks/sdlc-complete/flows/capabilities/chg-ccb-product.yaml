# Conversion capability (#1539) — flow-change-control Step 3 CCB panel (product owner).
apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: chg-ccb-product
  labels: { domain: change-control }
spec:
  description: CCB review from the product owner perspective — value to users/customers, scope-creep concerns, feature priority, market timing; returns a vote (APPROVE | REJECT | DEFER | ABSTAIN) with rationale.
  version: "1.0.0"
  inputs:
    - { name: change_request_path, type: string, required: true }
    - { name: impact_assessment_path, type: string, required: true }
  outputs:
    - { name: ccb_review_path, type: string }
  agent: product-owner
  idempotent: true
