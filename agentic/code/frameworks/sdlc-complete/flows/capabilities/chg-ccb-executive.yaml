# Conversion capability (#1539) — flow-change-control Step 3 CCB panel (executive sponsor).
apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: chg-ccb-executive
  labels: { domain: change-control }
spec:
  description: CCB review from the executive sponsor perspective — business value vs cost, strategic alignment, budget availability, risk tolerance; returns a vote (APPROVE | REJECT | DEFER | ABSTAIN) with rationale.
  version: "1.0.0"
  inputs:
    - { name: change_request_path, type: string, required: true }
    - { name: impact_assessment_path, type: string, required: true }
  outputs:
    - { name: ccb_review_path, type: string }
  agent: executive-sponsor
  idempotent: true
