# Conversion (#1539) — flow-test-strategy-execution Step 4 panel agent: UAT validation (acceptance level).
apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: teststrat-uat-validation
  labels: { domain: testing }
spec:
  description: Validate use-case coverage, acceptance criteria, user experience, and business logic against E2E results; render an acceptance decision (ACCEPTED | CONDITIONAL | REJECTED).
  version: "1.0.0"
  inputs:
    - { name: test_level, type: string, required: false }
  outputs:
    - { name: uat_validation, type: object }
  agent: product-owner
  idempotent: true
