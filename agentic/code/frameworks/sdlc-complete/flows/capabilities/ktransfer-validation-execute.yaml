# Conversion (#1539) — flow-knowledge-transfer Step 5b panel member.
apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: ktransfer-validation-execute
  labels: { domain: knowledge-transfer }
spec:
  description: As the receiver, execute each validation scenario — demonstrating problem understanding, systematic approach, correct solution, tool usage, and documented actions (.aiwg/knowledge/validation/scenario-{N}-results.md).
  version: "1.0.0"
  inputs:
    - { name: validation_scenarios, type: string, required: true }
    - { name: to_member, type: string, required: true }
  outputs:
    - { name: scenario_results, type: array }
  agent: learner
  idempotent: false
