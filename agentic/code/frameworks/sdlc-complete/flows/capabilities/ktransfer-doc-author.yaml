# Conversion (#1539) — flow-knowledge-transfer Step 2 panel member.
apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: ktransfer-doc-author
  labels: { domain: knowledge-transfer }
spec:
  description: Acting as the knowledge holder, author missing critical docs — runbooks, troubleshooting guides, architecture notes, and tribal knowledge needed for independent operation (.aiwg/knowledge/docs/{category}/).
  version: "1.0.0"
  inputs:
    - { name: doc_inventory, type: string, required: true }
    - { name: from_member, type: string, required: true }
  outputs:
    - { name: authored_docs, type: array }
  agent: subject-matter-expert
  idempotent: false
