# #1539 capability — prose Step 2.4: support readiness reviewer.
apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: gatechk-review-support
  labels: { domain: quality-gate }
spec:
  description: >-
    Validate support preparedness for the Product Release gate — support
    documentation complete, known issues documented, escalation paths defined,
    support team trained, user guides and FAQ/troubleshooting ready. Report
    READY | GAPS | BLOCKED (flow-gate-check Step 2.4 PR support review).
  version: "1.0.0"
  inputs:
    - { name: gate_type, type: string, required: true }
  outputs:
    - { name: review, type: string }
    - { name: readiness, type: string }
  agent: support-engineer
  idempotent: true
