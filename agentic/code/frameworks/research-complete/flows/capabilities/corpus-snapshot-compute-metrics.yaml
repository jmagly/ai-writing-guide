apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: corpus-snapshot-compute-metrics
  namespace: research-complete
  labels:
    category: research-reporting
    idempotent: "true"
spec:
  description: Compute dimensions, citation topology, GRADE distribution, source-type distribution, integrity, orphans, and previous-snapshot delta.
  version: 1.0.0
  inputs:
    - name: corpusRoot
      type: string
      required: false
  outputs:
    - name: metrics
      type: object
  agent: workflow-agent
  idempotent: true
  verification:
    command: aiwg corpus snapshot --format json
    expect: "\"dimensions\""
