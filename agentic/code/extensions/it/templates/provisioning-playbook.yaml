apiVersion: ops.aiwg.io/v1
kind: OpsPlaybook
metadata:
  name: provision-host
  labels:
    type: provisioning
  governance:
    classification: restricted-infrastructure
    owner: "{platform-operations-team}"
    handling:
      allowedSinks: [private-repository, encrypted-artifact-store]
      crossRepo: approval-required
      retentionPolicy: generic-durable
  lifecycle:
    schemaVersion: ops-evidence-lifecycle.aiwg.io/v1
    artifactId: provision-host
    category: generic
    classification: restricted-infrastructure
    sinkId: private-repository
    tier: durable
    createdAt: "{ISO-8601-created-at}"
    policyId: generic-durable
    policyVersion: "1"
    dispositionDeadline: "{ISO-8601-disposition-deadline}"
    action: summarize
    holds: []
spec:
  inventory: fleet-inventory
  targets:
    hosts:
      - "{hostname}"
  vars:
    hostname: "{hostname}"
    role: "{role}"
    ip: "{ip-address}"
    domain: "{domain}"
    site: "{site-name}"
    admin_user: "{admin-username}"
    ssh_key_ref: "{ssh-key-reference}"
  steps:
    - id: dns-register
      capability: dns-register
      inputs:
        - name: hostname
          from: vars.hostname
        - name: ip
          from: vars.ip
        - name: domain
          from: vars.domain
        - name: record_type
          value: A
        - name: reverse
          value: true

    - id: base-setup
      capability: host-standup
      depends_on:
        - dns-register
      inputs:
        - name: hostname
          from: vars.hostname
        - name: role
          from: vars.role
        - name: admin_user
          from: vars.admin_user
        - name: ssh_key_ref
          from: vars.ssh_key_ref
        - name: packages
          value: [curl, jq, htop, unattended-upgrades]

    - id: identity-enroll
      capability: identity-enroll
      depends_on:
        - base-setup
      inputs:
        - name: hostname
          from: vars.hostname
        - name: realm
          value: "{idp-realm}"
        - name: role
          from: vars.role
        - name: groups
          value: ["{default-group}"]

    - id: monitoring-register
      capability: monitoring-register
      depends_on:
        - base-setup
      inputs:
        - name: hostname
          from: vars.hostname
        - name: ip
          from: vars.ip
        - name: exporters
          value: [node-exporter, "{role-specific-exporter}"]
        - name: dashboard_template
          value: "{dashboard-template}"
        - name: alert_group
          value: "{alert-group}"

    - id: backup-configure
      capability: backup-configure
      depends_on:
        - base-setup
      inputs:
        - name: hostname
          from: vars.hostname
        - name: method
          value: "{restic|borgbackup}"
        - name: schedule
          value: "{cron-expression}"
        - name: retention
          value: "{days}"
        - name: paths
          value: [/etc, "{data-paths}"]

    - id: asset-register
      capability: host-inventory
      depends_on:
        - dns-register
        - base-setup
      inputs:
        - name: hostname
          from: vars.hostname
        - name: ip
          from: vars.ip
        - name: role
          from: vars.role
        - name: site
          from: vars.site
        - name: owner
          value: "{owner}"
        - name: sla_tier
          value: "{gold|silver|bronze}"

    - id: verify
      capability: host-verify
      depends_on:
        - dns-register
        - base-setup
        - identity-enroll
        - monitoring-register
        - asset-register
      inputs:
        - name: hostname
          from: vars.hostname
        - name: checks
          value: [dns_resolves, ssh_reachable, identity_enrolled, monitoring_reporting, cmdb_registered]
