apiVersion: it.ops.aiwg.io/v1
kind: ITService
metadata:
  name: "{service-name}"
  labels:
    type: service
    environment: "{production|staging|dev}"
  governance:
    classification: restricted-infrastructure
    owner: "{platform-operations-team}"
    handling:
      allowedSinks: [private-repository, encrypted-artifact-store]
      crossRepo: approval-required
      retentionPolicy: generic-durable
  lifecycle:
    schemaVersion: ops-evidence-lifecycle.aiwg.io/v1
    artifactId: "{service-name}"
    category: generic
    classification: restricted-infrastructure
    sinkId: private-repository
    tier: durable
    createdAt: "{ISO-8601-created-at}"
    policyId: generic-durable
    policyVersion: "1"
    dispositionDeadline: "{ISO-8601-disposition-deadline}"
    action: summarize
    holds: []
spec:
  deployment:
    host: "{hostname}"
    method: "{docker-compose|systemd|kubernetes}"
    compose_file: "{path-to-compose-file}"
    config_path: "{path-to-config}"
    data_path: "{path-to-persistent-data}"
  health:
    endpoint: "{url}"
    port: "{port}"
    protocol: "{http|tcp}"
    interval: "{seconds}"
    timeout: "{seconds}"
  dependencies:
    - "{service-name}"
  backup:
    enabled: false
    schedule: "{cron-expression}"
    retention: "{days}"
    method: "{restic|borgbackup|rsync}"
    target: "{backup-destination-path}"
  monitoring:
    dashboard: "{dashboard-url}"
    alerts:
      - "{alert-name}"
  owner: "{team or person}"
  sla:
    tier: "{gold|silver|bronze}"
    rto: "{hours}"
    rpo: "{hours}"
  notes: ""
