apiVersion: it.ops.aiwg.io/v1
kind: ITAsset
metadata:
  name: "{asset-id}"
  labels:
    type: "{server|workstation|network|storage}"
    status: "{active|retired|maintenance}"
  governance:
    classification: restricted-infrastructure
    owner: "{platform-operations-team}"
    handling:
      allowedSinks: [private-repository, encrypted-artifact-store]
      crossRepo: approval-required
      retentionPolicy: generic-durable
  lifecycle:
    schemaVersion: ops-evidence-lifecycle.aiwg.io/v1
    artifactId: "{asset-id}"
    category: generic
    classification: restricted-infrastructure
    sinkId: private-repository
    tier: durable
    createdAt: "{ISO-8601-created-at}"
    policyId: generic-durable
    policyVersion: "1"
    dispositionDeadline: "{ISO-8601-disposition-deadline}"
    action: summarize
    holds: []
spec:
  asset:
    serial_number: "{serial}"
    model: "{model}"
    manufacturer: "{manufacturer}"
    purchased: "{YYYY-MM-DD}"
    warranty_expires: "{YYYY-MM-DD}"
  owner: "{team or person}"
  location:
    site: "{site-name}"
    building: "{building}"
    rack: "{rack-id}"
    rack_unit: "{u-position}"
  lifecycle:
    provisioned: "{YYYY-MM-DD}"
    last_maintained: "{YYYY-MM-DD}"
    decommission_date: null  # set when scheduled for retirement
  sla:
    tier: "{gold|silver|bronze}"
    rto: "{hours}"
    rpo: "{hours}"
  network:
    primary_ip: "{ip-address}"
    management_ip: "{ip-address}"
    hostname: "{hostname}"
    mac_address: "{mac}"
    vlan: "{vlan-id}"
  tags: []
  notes: ""
