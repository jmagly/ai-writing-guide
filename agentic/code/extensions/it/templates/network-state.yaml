apiVersion: it.ops.aiwg.io/v1
kind: ITNetworkState
metadata:
  name: "{network-name}"
  labels:
    type: network-state
  governance:
    classification: restricted-infrastructure
    owner: "{network-operations-team}"
    handling:
      allowedSinks: [private-repository, encrypted-artifact-store]
      crossRepo: approval-required
      retentionPolicy: network-inventory-durable
  lifecycle:
    schemaVersion: ops-evidence-lifecycle.aiwg.io/v1
    artifactId: "{network-name}"
    category: network-inventory
    classification: restricted-infrastructure
    sinkId: encrypted-artifact-store
    tier: durable
    createdAt: "{ISO-8601-created-at}"
    policyId: network-inventory-durable
    policyVersion: "1"
    dispositionDeadline: "{ISO-8601-disposition-deadline}"
    action: archive
    archiveSink: encrypted-artifact-store
    holds: []
spec:
  vlans:
    - id: "{vlan-id}"
      name: "{name}"
      subnet: "{cidr}"
      gateway: "{ip}"
      purpose: "{management|production|storage|guest}"
  dns_zones:
    - zone: "{domain}"
      type: "{primary|secondary}"
      server: "{hostname}"
      records:
        - name: "{record-name}"
          type: "{A|AAAA|CNAME|MX|TXT}"
          value: "{value}"
  firewall_rules:
    - name: "{rule-name}"
      source: "{cidr}"
      destination: "{cidr}"
      port: "{port}"
      protocol: "{tcp|udp}"
      action: "{allow|deny}"
      comment: "{description}"
  switches:
    - name: "{switch-name}"
      model: "{model}"
      management_ip: "{ip}"
      ports: "{count}"
      uplinks:
        - "{connected-to}"
  dhcp:
    - scope: "{subnet-cidr}"
      range_start: "{ip}"
      range_end: "{ip}"
      lease_time: "{seconds}"
      server: "{hostname}"
