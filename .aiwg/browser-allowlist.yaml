# Browser control allow-list — AIWG v2026.5.11 social launch (issue #1482)
# Consumed by the browser-control-safety rule before any navigation.
# Origins NOT listed here are denied. Sensitive origins additionally require
# explicit operator authorization for any write/submit action (profile edits, posts).
version: "1"
mode: allow-list

allow:
  # Copy + image collaboration (operator-authorized in #1482)
  - https://gemini.google.com
  # Official social surfaces being set up / posted to (read+prepare allowed; posting gated)
  - https://x.com
  - https://twitter.com
  - https://www.reddit.com
  - https://reddit.com
  # Link/verification destinations referenced by the campaign
  - https://aiwg.io
  - https://docs.aiwg.io
  - https://git.integrolabs.net
  - https://github.com
  - https://www.npmjs.com

# Sensitive origins: navigation permitted, but form submission / posting /
# profile or community edits require explicit operator approval per session
# (browser-control-safety Rule 3 + human-authorization). Image/copy generation
# in an already-logged-in Gemini session is the operator-blessed exception.
sensitive_patterns:
  - "*x.com*"
  - "*twitter.com*"
  - "*reddit.com*"
  - "*google.com*"
  - "accounts.google.com"

# Hard gates (never auto-execute without operator approval at the submit step):
#   - Posting/replying publicly on X or Reddit
#   - Editing X profile (name, bio, website, avatar, header)
#   - Editing r/AIWG community description, icon, banner, or publishing/pinning posts
#   - Generating additional image variants before operator reviews the first image
