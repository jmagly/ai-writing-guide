<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script>
      (function () {
        var tenant = "__PAGENARY_TENANT__";
        var configuredBase = "__PAGENARY_BASE_PATH__";
        var pathname = location.pathname || "/";
        var explicitBase = configuredBase && configuredBase.charAt(0) === "/" ? configuredBase : "";
        var autoBase = pathname.endsWith("/") ? pathname : pathname.slice(0, pathname.lastIndexOf("/") + 1);
        var base = explicitBase || autoBase || "/";
        document.write('<base href="' + base + '">');
        document.documentElement.classList.add("has-js");

        if (pathname === "/agetnic-sandbox" ||
            pathname === "/agetnic-sandbox/" ||
            pathname === "/agentic-sandbox") {
          window.location.replace("/agentic-sandbox/" + window.location.search + window.location.hash);
        }
      })();
    </script>
    <title>AIWG Documentation</title>
    <meta name="description" content="Open, inspectable tools for durable AI-assisted work." />
    <meta name="theme-color" content="#e8edf0" />
    <meta property="og:title" content="AIWG Documentation" />
    <meta property="og:description" content="Build, inspect, and operate AIWG with practical guides and reference material." />
    <meta property="og:image" content="https://aiwg.io/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./open-kit.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>

    <header class="shell topbar">
      <button type="button" id="mobileMenuToggle" class="mobile-menu-toggle" aria-label="Toggle documentation navigation" aria-expanded="false">
        <span class="menu-icon"></span>
      </button>
      <a class="brand" id="brandHome" href="#" rel="home" title="AIWG documentation home">
        <span class="brand-mark">AIWG</span>
        <span class="brand-sub">Docs</span>
      </a>
      <nav class="site-links" aria-label="AIWG sites">
        <a href="https://aiwg.io/">Open kit</a>
        <a href="https://aiwg.io/install/">Install</a>
        <a href="https://github.com/jmagly/aiwg">GitHub</a>
      </nav>
      <div class="top-actions">
        <button type="button" id="commandToggle" class="ghost-button" aria-haspopup="dialog" aria-controls="commandPalette">
          <span class="ghost-icon">/</span>
          <span class="ghost-label">Find</span>
        </button>
        <button type="button" id="shareBtn" class="ghost-button" aria-haspopup="dialog">
          <span class="ghost-icon">↗</span>
          <span class="ghost-label">Share</span>
        </button>
        <button type="button" id="exportBtn" class="ghost-button">
          <span class="ghost-icon">↓</span>
          <span class="ghost-label">Export</span>
        </button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="Documentation navigation">
        <div class="sidebar-inner">
          <div class="sidebar-intro">
            <span class="eyebrow">Make something durable</span>
            <strong>AIWG / OPEN KIT</strong>
            <p>Guides, architecture, and reference material for the system you control.</p>
          </div>
          <nav id="nav" class="nav" aria-label="Documentation sections"></nav>
          <div class="sidebar-footer">
            <a href="https://discord.gg/BuAusFMxdA">Community ↗</a>
            <a href="https://www.npmjs.com/package/aiwg">npm ↗</a>
          </div>
        </div>
      </aside>
      <main id="app" class="canvas" tabindex="-1" aria-live="polite"></main>
    </div>

    <footer class="shell footnote">
      <span><strong>AIWG</strong> · MIT licensed · __AIWG_VERSION__</span>
      <span class="divider"></span>
      <span>Open tools for durable AI work · <span id="year"></span></span>
    </footer>

    <div id="commandPalette" class="cmd" role="dialog" aria-modal="true" aria-labelledby="commandLabel" hidden>
      <div class="cmd-surface" role="document">
        <div class="cmd-header">
          <label id="commandLabel" class="cmd-title" for="commandInput">Find anything in AIWG</label>
          <input id="commandInput" class="cmd-input" type="search" name="query" autocomplete="off" placeholder="Try installation, agents, memory…" />
        </div>
        <ul id="commandList" class="cmd-list" role="listbox"></ul>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
