# Doc Site Build Validation
#
# Validates that the documentation site builds successfully when docs change.
# Catches broken links, bad config, and build errors before merge.

name: Docsite Build

on:
  push:
    branches: [main, develop]
    paths: ['docs/**', '.gitea/workflows/docsite-build.yml']
  pull_request:
    branches: [main, develop]
    paths: ['docs/**', '.gitea/workflows/docsite-build.yml']

concurrency:
  group: docsite-build-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 15
    # Force bash so `set -o pipefail` works (gitea-runner-host default is sh/dash).
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout AIWG
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # The doc-site publisher is consumed from npm as the `@pagenary/publisher`
      # devDependency (bin: `pagenary`), not git-cloned. This build no longer
      # touches GT_ACCESS_TOKEN or any secret, so the former fork-PR clone
      # guard (#1289 / A14) is unnecessary here — fork PRs can run the full
      # validation safely. Migration: #1484. The reusable fork-PR guard
      # snippet still lives in `.gitea/workflows/README.md` for secret-bearing
      # workflows (e.g. docsite-deploy on push/tags only).
      - name: Install dependencies
        run: npm ci

      - name: Configure tenant
        run: |
          node tools/docs/build-public-source.mjs
          # strictLinks is true (#1486): pagenary 2026.5.1 (roctinam/pagenary#12)
          # aborts the build on broken internal links. All 53 broken links are
          # fixed, so the gate is now enforced — broken internal links fail the
          # docs build.
          cat > "${{ gitea.workspace }}/tenants.json" <<'TENANTS'
          {
            "tenants": [
              {
                "id": "aiwg-docs",
                "enabled": true,
                "source": { "type": "local", "path": "./dist/public-docs-source" },
                "target": { "type": "local", "path": "./dist/aiwg-docs" },
                "domains": ["docs.aiwg.io"],
                "strictLinks": true
              }
            ]
          }
          TENANTS

      - name: Build doc site
        run: |
          node tools/docs/audit-audiences.mjs
          node -e "const a=require('./dist/docs-audience-audit.json'); if(a.totals.onboardingNeedsReview || a.beforeAfter.current.homepageCommandChecklistItems || a.beforeAfter.current.publicCliNavigationEntries) process.exit(1)"
          npm pack --dry-run --json --ignore-scripts > dist/npm-pack-docs.json
          node -e "const p=require('./dist/npm-pack-docs.json')[0].files.map(f=>f.path); for (const f of ['docs/agents/README.md','docs/agents/cli-reference.md','docs/agents/providers/README.md']) if(!p.includes(f)) throw new Error('agent reference missing from package: '+f)"
          npx pagenary build:tenants aiwg-docs
          node tools/docs/write-blog-static-pages.mjs dist/aiwg-docs

      - name: Verify build output
        run: |
          set -euo pipefail
          OUT="${{ gitea.workspace }}/dist/aiwg-docs"
          test -f "$OUT/index.html" || { echo "::error::doc-site build produced no index.html"; exit 1; }
          test -f "$OUT/blog/index.html" || { echo "::error::doc-site build produced no blog/index.html"; exit 1; }
          test -d "$OUT/sections"   || { echo "::error::doc-site build produced no sections/"; exit 1; }
          if find "$OUT" -type f \( -path '*/agents/*' -o -name 'agents--*.js' \) | grep -q .; then
            echo "::error::agent-reference material leaked into the public docs output"
            exit 1
          fi
          echo "Build OK: $(ls "$OUT/sections" | wc -l) section files"
