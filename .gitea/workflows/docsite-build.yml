# Doc Site Build Validation
#
# Validates that the documentation site builds successfully when docs change.
# Catches broken links, bad config, and build errors before merge.

name: Docsite Build

on:
  push:
    branches: [main, develop]
    paths: ['docs/**']
  pull_request:
    branches: [main, develop]
    paths: ['docs/**']

concurrency:
  group: ci-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 15
    # Force bash so `set -o pipefail` works (gitea-runner-host default is sh/dash).
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout AIWG
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # Fork-PR defense-in-depth: skip the pagenary clone for fork PRs.
      # The #1289 / A14 audit verified Gitea's fork-PR secret-exposure
      # semantics by reading the source (`models/secret/secret.go`
      # `GetSecretsOfTask` — user-defined secrets are NOT exposed to fork
      # PRs by default; only the auto-issued `GITHUB_TOKEN` is). This
      # guard remains as belt-and-suspenders so the behavior is explicit
      # in the workflow rather than relying on runtime defaults that may
      # drift with Gitea versions, and so fork PRs cannot reach
      # docs.aiwg.io deploy paths even on a runtime regression. Internal-
      # branch PRs and pushes proceed normally. See
      # `.aiwg/architecture/adr-pr-trigger-hardening.md` for the audit
      # disposition matrix and `.gitea/workflows/README.md` "PR-trigger
      # workflow hardening" for the reusable guard snippet.
      - name: Clone pagenary
        if: ${{ gitea.event.pull_request.head.repo.fork != true }}
        env:
          GT_ACCESS_TOKEN: ${{ secrets.GT_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Token lives in a transient mode-600 file consumed by git's
          # credential helper. Avoids exposing the token in process
          # arguments (visible to `ps`, core dumps, error output) which
          # was the case with the previous token-in-URL pattern.
          # See .claude/rules/token-security.md rule 2 and #1284 (A6).
          GIT_CREDS="$(mktemp)"
          chmod 600 "$GIT_CREDS"
          trap 'rm -f "$GIT_CREDS"' EXIT
          printf 'https://token:%s@git.integrolabs.net\n' "${GT_ACCESS_TOKEN}" > "$GIT_CREDS"
          git -c "credential.helper=store --file=$GIT_CREDS" \
            clone https://git.integrolabs.net/roctinam/pagenary.git /tmp/pagenary

      - name: Install pagenary dependencies
        working-directory: /tmp/pagenary/apps/publisher
        run: npm ci

      - name: Configure tenant
        run: |
          cat > /tmp/pagenary/apps/publisher/tenants.json <<'TENANTS'
          {
            "$schema": "./tenants.schema.json",
            "tenants": [
              {
                "id": "aiwg-docs",
                "source": {
                  "type": "local",
                  "path": "${{ gitea.workspace }}/docs"
                },
                "domains": ["docs.aiwg.io"],
                "strictLinks": true
              }
            ]
          }
          TENANTS

      - name: Build doc site
        working-directory: /tmp/pagenary/apps/publisher
        run: node scripts/build-tenants.js aiwg-docs

      - name: Verify build output
        run: |
          ls -la /tmp/pagenary/apps/publisher/dist/aiwg-docs/
          echo "Build successful"
