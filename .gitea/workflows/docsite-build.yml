# Doc Site Build Validation
#
# Validates that the documentation site builds successfully when docs change.
# Catches broken links, bad config, and build errors before merge.

name: Docsite Build

on:
  push:
    branches: [main, develop]
    paths: ['docs/**']
  pull_request:
    branches: [main, develop]
    paths: ['docs/**']

concurrency:
  group: ci-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 15
    # Force bash so `set -o pipefail` works (gitea-runner-host default is sh/dash).
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout AIWG
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # Fork-PR defense-in-depth: Gitea's secret-exposure behavior for
      # `pull_request` events from forks is version-dependent and not
      # currently verified for the running instance (#1278 audit notes).
      # Skip the dbbuilder clone for fork PRs — docs build will fail on
      # forks, which is the desired behavior (fork PRs should not reach
      # docs.aiwg.io deploy paths). Internal-branch PRs and pushes proceed
      # normally. Revisit once #1289 (A14 — PR-trigger audit) verifies the
      # exact fork-PR secret-exposure semantics.
      - name: Clone dbbuilder
        if: ${{ gitea.event.pull_request.head.repo.fork != true }}
        env:
          GT_ACCESS_TOKEN: ${{ secrets.GT_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Token lives in a transient mode-600 file consumed by git's
          # credential helper. Avoids exposing the token in process
          # arguments (visible to `ps`, core dumps, error output) which
          # was the case with the previous token-in-URL pattern.
          # See .claude/rules/token-security.md rule 2 and #1284 (A6).
          GIT_CREDS="$(mktemp)"
          chmod 600 "$GIT_CREDS"
          trap 'rm -f "$GIT_CREDS"' EXIT
          printf 'https://token:%s@git.integrolabs.net\n' "${GT_ACCESS_TOKEN}" > "$GIT_CREDS"
          git -c "credential.helper=store --file=$GIT_CREDS" \
            clone https://git.integrolabs.net/roctinam/dbbuilder.git /tmp/dbbuilder

      - name: Install dbbuilder dependencies
        working-directory: /tmp/dbbuilder/apps/publisher
        run: npm ci

      - name: Configure tenant
        run: |
          cat > /tmp/dbbuilder/apps/publisher/tenants.json <<'TENANTS'
          {
            "$schema": "./tenants.schema.json",
            "tenants": [
              {
                "id": "aiwg-docs",
                "source": {
                  "type": "local",
                  "path": "${{ gitea.workspace }}/docs"
                },
                "domains": ["docs.aiwg.io"],
                "strictLinks": true
              }
            ]
          }
          TENANTS

      - name: Build doc site
        working-directory: /tmp/dbbuilder/apps/publisher
        run: node scripts/build-tenants.js aiwg-docs

      - name: Verify build output
        run: |
          ls -la /tmp/dbbuilder/apps/publisher/dist/aiwg-docs/
          echo "Build successful"
