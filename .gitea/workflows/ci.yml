# Main CI Workflow
#
# Runs on all pushes and pull requests to main/develop.
# Executes tests, type checking, and linting.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install dependencies
        # Plain `npm ci` (no --omit=optional). Sharp's prebuilt libvips
        # binary is in its optionalDependencies — skipping optional deps
        # forced sharp to fall back to a from-source gyp build that needed
        # libvips-dev system headers (#1018). Other workflows already use
        # plain `npm ci` and resolve sharp without issue.
        run: npm ci

      - name: Lint dependency sources (#1300)
        # Scans package.json + package-lock.json for git+, git://, github:,
        # file:, link:, and non-registry tarball sources. Closes the Mini
        # Shai-Hulud dep-injection vector (control C22). Allowlist lives at
        # ci/dep-source-allowlist.yaml; see ADR adr-dep-source-policy.md and
        # docs/contributing/dependency-sources.md.
        run: npm run lint:dep-sources

      - name: Scan known affected package feed (#1353)
        # Reads the operator-maintained CSV feed from either the canonical
        # mounted path or AIWG_AFFECTED_PACKAGES_CSV. In CI, prefer a raw gist
        # URL or another immutable published snapshot so the run is auditable.
        run: |
          if [ -n "${AIWG_AFFECTED_PACKAGES_CSV:-}" ] || [ -f /mnt/ops/users/roctinam/Downloads/22-packages.csv ]; then
            npm run lint:affected-packages
          else
            echo "Skipping affected-package scan: no CSV source configured on this runner"
          fi

      - name: Audit dep-graph signatures (#1288 / A12)
        # Runs on every push (not just publish) so signature regressions
        # in the dep graph surface quickly. Time-bounded waivers live in
        # ci/npm-audit-signatures-waivers.yaml — expired waivers fail.
        # See .aiwg/architecture/adr-publish-time-evidence.md.
        run: npm run lint:audit-signatures

      - name: Run type check
        run: npm run typecheck

      - name: Build CLI (required by integration tests that spawn bin/aiwg.mjs)
        run: npm run build:cli

      - name: Lint schemas
        # Validates schemas/executor-v1.json (draft-2020-12) and all
        # fixtures in test/conformance/executor-v1/fixtures/ against it.
        # Fails the build if the schema is structurally invalid or a fixture
        # violates the declared _validates_as shape. (#1178)
        run: npm run lint:schemas

      - name: Run conformance suite (fixture mode)
        # Exercises the executor-contract v1 dispatch path via fixture replay.
        # Runs as a separate step (not folded into test:ci) to keep the existing
        # CI budget intact. Zero network I/O — fully deterministic. (#1183)
        run: npm run test:conformance

      - name: Run tests
        env:
          # CI runs in docker-in-docker on the Gitea runner — cold start is
          # ~50ms slower than a bare-metal laptop. The local dev budget of
          # 150ms is preserved as the aspirational target; CI uses a looser
          # budget so a slow-runner day doesn't block an otherwise-green PR.
          # Bump either value if regression hits consistently.
          AIWG_PERF_BUDGET_VERSION_MS: "300"
          AIWG_PERF_BUDGET_HELP_MS: "500"
        run: npm run test:ci

      - name: Run tier-3 integration suite (#1174)
        # Spawns aiwg serve via bin/aiwg.mjs on an ephemeral port. The
        # readiness probe targets /api/health (a known-registered route)
        # which was the missing piece — root-URL probes returned 503 in CI
        # because apps/web/dist isn't built before this step, but /api/health
        # is route-registered before the Dashboard banner prints (#1277).
        env:
          # Allow the serve startup banner up to 30s in docker-in-docker.
          AIWG_SERVE_HTTP_TIMEOUT_MS: "30000"
        run: npm run test:integration:serve

  build:
    name: Build
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 10
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install dependencies
        # Plain `npm ci` — see ci.yml Test job comment re: sharp + libvips (#1018).
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la dist/ || echo "dist/ directory not found"
          ls -la dist/src/ || echo "dist/src/ directory not found"

      - name: Verify .aiwg/ excluded from build
        run: |
          if [ -d "dist/.aiwg" ] || find dist/ -path '*/.aiwg/*' 2>/dev/null | grep -q .; then
            echo "FATAL: .aiwg/ content found in build output!"
            exit 1
          fi
          echo "✓ .aiwg/ correctly excluded from build output"
