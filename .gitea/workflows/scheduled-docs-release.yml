name: Scheduled Docs Release

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview due posts without committing'
        required: false
        default: false
        type: boolean

concurrency:
  group: scheduled-docs-release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote due docs posts
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout AIWG
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Promote due scheduled posts
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node tools/docs/promote-scheduled-posts.mjs --dry-run
          else
            node tools/docs/promote-scheduled-posts.mjs
          fi

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- docs scheduled-docs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate promoted docs
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          npm ci
          cat > "${{ gitea.workspace }}/tenants.json" <<'TENANTS'
          {
            "tenants": [
              {
                "id": "aiwg-docs",
                "enabled": true,
                "source": { "type": "local", "path": "./docs" },
                "target": { "type": "local", "path": "./dist/aiwg-docs" },
                "domains": ["docs.aiwg.io"],
                "strictLinks": true
              }
            ]
          }
          TENANTS
          npx pagenary build:tenants aiwg-docs

      - name: Commit promotion
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "docs-scheduler"
          git config user.email "docs-scheduler@integrolabs.net"
          git add docs scheduled-docs
          git commit -m "Publish scheduled docs posts"
          git push origin HEAD:main

      - name: Dispatch docsite deploy
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEA_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN is unavailable; cannot dispatch docsite deploy"
            exit 1
          fi
          HTTP_STATUS=$(curl -sS -o /tmp/docsite-dispatch-body.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://git.integrolabs.net/api/v1/repos/roctinam/aiwg/actions/workflows/docsite-deploy.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"reason\":\"Scheduled docs promotion from ${GITHUB_SHA}\"}}")
          echo "Docsite deploy dispatch HTTP status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" != "204" ]; then
            echo "::error::docsite deploy dispatch failed with HTTP ${HTTP_STATUS}"
            cat /tmp/docsite-dispatch-body.txt
            exit 1
          fi
