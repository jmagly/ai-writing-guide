name: Fortemi Shard Conformance

on:
  push:
    branches: [main, develop]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/artifacts/fortemi-shard-export.ts'
      - 'test/unit/artifacts/fortemi-shard-export.test.ts'
      - 'test/fixtures/fortemi-shard/**'
      - 'schemas/artifacts/aiwg-fortemi-shard-receipt.v1.schema.json'
      - 'schemas/artifacts/aiwg-fortemi-full-v1-consumer-receipt.v1.schema.json'
      - 'tools/ci/verify-aiwg-fortemi-shard-receipt.mjs'
      - '.gitea/workflows/fortemi-shard-conformance.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/artifacts/fortemi-shard-export.ts'
      - 'test/unit/artifacts/fortemi-shard-export.test.ts'
      - 'test/fixtures/fortemi-shard/**'
      - 'schemas/artifacts/aiwg-fortemi-shard-receipt.v1.schema.json'
      - 'schemas/artifacts/aiwg-fortemi-full-v1-consumer-receipt.v1.schema.json'
      - 'tools/ci/verify-aiwg-fortemi-shard-receipt.mjs'
      - '.gitea/workflows/fortemi-shard-conformance.yml'
  workflow_dispatch:

concurrency:
  group: fortemi-shard-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  producer-consumer-receipt:
    name: Published Core receipts → full-v1 clean PGlite and Fortemi
    # Use the shared Node job image and the host Docker socket. The preflight
    # installs only the distro-packaged CLI when the image does not include it.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Prepare and verify runner capabilities
        shell: bash
        run: |
          set -euo pipefail
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) throw new Error('Node 20 or newer is required')"
          git --version
          if ! command -v docker >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends docker.io >/dev/null
          fi
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          docker info >/dev/null

      - name: Clean checkout AIWG exact revision
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --no-tags --depth=1 origin "${GITHUB_SHA:?GITHUB_SHA is required}"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PRODUCER_COMMIT="$(node -p "require('./test/fixtures/fortemi-shard/aiwg-core-v1.receipt.json').producer.commit")"
          SOURCE_AUTHORITY_COMMIT="$(node -p "require('./test/fixtures/fortemi-shard/aiwg-core-v1.receipt.json').producer.source_contract.authority_commit")"
          FULL_CONSUMER_COMMIT="$(node -p "require('./test/fixtures/fortemi-shard/aiwg-full-v1.consumer.receipt.json').consumer.commit")"
          # One atomic shallow fetch avoids concurrent shallow-file rewrites
          # observed with Git 2.54 on container-backed Gitea runners.
          git fetch --quiet --no-tags --depth=1 origin \
            "$PRODUCER_COMMIT" \
            "$SOURCE_AUTHORITY_COMMIT" \
            "$FULL_CONSUMER_COMMIT"
          test "$(git rev-parse "$PRODUCER_COMMIT^{commit}")" = "$PRODUCER_COMMIT"
          test "$(git rev-parse "$SOURCE_AUTHORITY_COMMIT^{commit}")" = "$SOURCE_AUTHORITY_COMMIT"
          test "$(git rev-parse "$FULL_CONSUMER_COMMIT^{commit}")" = "$FULL_CONSUMER_COMMIT"

      - name: Install locked published package graph
        run: npm ci

      - name: Verify AIWG core-v1 and full-v1 consumer receipts
        run: |
          npx vitest run test/unit/artifacts/fortemi-shard-export.test.ts
          node tools/ci/verify-aiwg-fortemi-shard-receipt.mjs

      - name: Clean checkout pinned Fortemi consumer
        shell: bash
        run: |
          set -euo pipefail
          FORTEMI_COMMIT="$(node -p "require('./test/fixtures/fortemi-shard/aiwg-full-v1.consumer.receipt.json').consumers.fortemi.commit")"
          rm -rf /tmp/aiwg-fortemi-consumer
          git init -q /tmp/aiwg-fortemi-consumer
          git -C /tmp/aiwg-fortemi-consumer remote add origin https://git.integrolabs.net/Fortemi/fortemi.git
          git -C /tmp/aiwg-fortemi-consumer fetch --quiet --no-tags --depth=2 origin "$FORTEMI_COMMIT"
          git -C /tmp/aiwg-fortemi-consumer checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/aiwg-fortemi-consumer rev-parse HEAD)" = "$FORTEMI_COMMIT"
          test -z "$(git -C /tmp/aiwg-fortemi-consumer status --porcelain)"

      - name: Build pinned Fortemi test database
        shell: bash
        run: |
          set -euo pipefail
          DB_IMAGE="aiwg-fortemi-testdb:${GITHUB_RUN_ID}"
          echo "DB_IMAGE=${DB_IMAGE}" >> "$GITHUB_ENV"
          docker build \
            -f /tmp/aiwg-fortemi-consumer/build/Dockerfile.testdb \
            -t "$DB_IMAGE" \
            /tmp/aiwg-fortemi-consumer

      - name: Start isolated Fortemi test database
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="aiwg-fortemi-${GITHUB_RUN_ID}"
          DB_USER=matric
          DB_PASSWORD="aiwg-fortemi-${GITHUB_RUN_ID}"
          DB_NAME=matric_test

          # Gitea's ubuntu-latest label runs this job in a container with the
          # host Docker socket mounted. Attach the database to the same network
          # and use its container IP. A host-backed runner instead uses an
          # automatically allocated loopback port.
          JOB_NETWORK=''
          if [ -n "${HOSTNAME:-}" ] && docker inspect "$HOSTNAME" >/dev/null 2>&1; then
            JOB_NETWORK="$(docker inspect \
              --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' \
              "$HOSTNAME" | head -n 1)"
          fi

          if [ -n "$JOB_NETWORK" ]; then
            docker run -d --name "$DB_CONTAINER" \
              --network "$JOB_NETWORK" \
              -e POSTGRES_USER="$DB_USER" \
              -e POSTGRES_PASSWORD="$DB_PASSWORD" \
              -e POSTGRES_DB="$DB_NAME" \
              "$DB_IMAGE"
            DB_HOST="$(docker inspect \
              --format "{{with index .NetworkSettings.Networks \"${JOB_NETWORK}\"}}{{.IPAddress}}{{end}}" \
              "$DB_CONTAINER")"
            DB_PORT=5432
          else
            docker run -d --name "$DB_CONTAINER" \
              -p 127.0.0.1::5432 \
              -e POSTGRES_USER="$DB_USER" \
              -e POSTGRES_PASSWORD="$DB_PASSWORD" \
              -e POSTGRES_DB="$DB_NAME" \
              "$DB_IMAGE"
            DB_HOST=127.0.0.1
            DB_PORT="$(docker port "$DB_CONTAINER" 5432/tcp | awk -F: 'END { print $NF }')"
          fi

          test -n "$DB_HOST"
          test -n "$DB_PORT"
          echo "DB_CONTAINER=${DB_CONTAINER}" >> "$GITHUB_ENV"
          echo "DB_USER=${DB_USER}" >> "$GITHUB_ENV"
          echo "DB_NAME=${DB_NAME}" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}" >> "$GITHUB_ENV"
          # The image entrypoint starts a temporary Unix-socket server while it
          # initializes extensions. Require the final TCP listener so tests
          # cannot race the handoff between bootstrap and the production server.
          for attempt in {1..30}; do
            if docker exec "$DB_CONTAINER" \
              pg_isready -h localhost -p 5432 -U "$DB_USER" -d "$DB_NAME" \
                >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'Fortemi test database did not become ready' >&2
          exit 1

      - name: Migrate isolated Fortemi test database
        shell: bash
        run: |
          set -euo pipefail
          for migration in /tmp/aiwg-fortemi-consumer/migrations/*.sql; do
            docker exec -i "$DB_CONTAINER" \
              psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
                < "$migration"
          done

      - name: Verify clean Fortemi import and semantic re-export
        run: node tools/ci/verify-aiwg-fortemi-shard-receipt.mjs --server-checkout /tmp/aiwg-fortemi-consumer

      - name: Remove isolated database
        if: always()
        shell: bash
        run: |
          if [ -n "${DB_CONTAINER:-}" ]; then
            docker rm -f "$DB_CONTAINER" >/dev/null 2>&1 || true
          fi
          if [ -n "${DB_IMAGE:-}" ]; then
            docker image rm -f "$DB_IMAGE" >/dev/null 2>&1 || true
          fi
