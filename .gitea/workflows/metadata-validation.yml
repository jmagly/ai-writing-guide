# Validate Framework Metadata
#
# Validates plugin and agent metadata schemas.
# Runs on changes to agentic framework files.
# Requires Node 20+ (hnswlib-node native addon not compatible with Node 18 EOL).

name: Validate Metadata

on:
  push:
    branches: [main, develop]
    paths:
      - '.claude/**'
      - 'agentic/**'
      - 'src/plugin/**'
      - 'tools/workspace/**'
      - '.gitea/workflows/metadata-validation.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '.claude/**'
      - 'agentic/**'
      - 'src/plugin/**'
      - 'tools/workspace/**'
      - '.gitea/workflows/metadata-validation.yml'

concurrency:
  group: ci-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  validate-metadata:
    name: Validate Plugin Metadata
    runs-on: ubuntu-latest
    container: node:20
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: |
          echo "Building TypeScript..."
          npm run build 2>&1 || { echo "Build failed with exit code $?"; exit 1; }
          echo "Build completed."

      - name: Check dist directory
        run: ls -la dist/src/plugin/ || echo "dist/src/plugin/ directory does not exist"

      - name: Validate Metadata Schema
        run: |
          echo "Validating plugin metadata..."
          node --input-type=module -e "
            import { MetadataValidator } from './dist/src/plugin/metadata-validator.js';
            import path from 'path';

            async function validateAll() {
              const validator = new MetadataValidator({
                checkFileReferences: true,
                strict: false
              });

              const dirs = [
                'agentic/code/frameworks/sdlc-complete/agents',
                'agentic/code/frameworks/sdlc-complete/commands'
              ];

              let totalErrors = 0;
              let totalWarnings = 0;
              let totalFiles = 0;

              const skipPatterns = ['manifest.md', 'README.md', 'agent-template.md', 'openai-compat.md', 'factory-compat.md'];

              for (const dir of dirs) {
                const dirPath = path.resolve(process.cwd(), dir);
                try {
                  const results = await validator.validateDirectory(dirPath, true);

                  for (const [file, result] of results) {
                    const basename = path.basename(file);
                    if (skipPatterns.includes(basename)) {
                      console.log('Skipping doc file: ' + basename);
                      continue;
                    }

                    totalFiles++;
                    if (!result.valid) {
                      totalErrors += result.errors.length;
                      console.log('\n❌ ' + file);
                      for (const error of result.errors) {
                        console.log('   Error: ' + error.message);
                      }
                    }
                    totalWarnings += result.warnings.length;
                  }
                } catch (e) {
                  console.log('Skipping ' + dir + ': ' + e.message);
                }
              }

              console.log('\n' + '='.repeat(50));
              console.log('Validation Summary:');
              console.log('  Files Validated: ' + totalFiles);
              console.log('  Errors:         ' + totalErrors);
              console.log('  Warnings:       ' + totalWarnings);
              console.log('='.repeat(50));

              if (totalErrors > 0) {
                console.log('\n❌ Metadata validation failed with ' + totalErrors + ' errors');
                process.exit(1);
              }

              console.log('\n✓ Metadata validation passed');
            }

            validateAll().catch(e => {
              console.error('Validation script error:', e);
              process.exit(1);
            });
          "

  validate-skill-frontmatter:
    name: Validate SKILL.md Frontmatter (changed files)
    runs-on: ubuntu-latest
    container: node:20
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install js-yaml
        run: npm install --no-save js-yaml

      - name: Identify changed SKILL.md files
        id: changed
        shell: bash
        run: |
          BASE_REF="${{ gitea.base_ref || gitea.event.pull_request.base.ref || 'main' }}"
          git fetch --no-tags origin "$BASE_REF" || true

          # Resolve base SHA. Prefer merge-base for accurate three-way diff;
          # fall back to direct ref then to HEAD~1 for non-PR runs.
          if BASE_SHA=$(git merge-base HEAD "origin/$BASE_REF" 2>/dev/null); then
            :
          elif BASE_SHA=$(git rev-parse "origin/$BASE_REF" 2>/dev/null); then
            :
          else
            BASE_SHA="HEAD~1"
          fi
          echo "Base: $BASE_SHA"

          # Get all changed/added files (no git pathspec — `**` is literal
          # without `:(glob)` magic). Then filter to SKILL.md in shell.
          git diff --name-only --diff-filter=AM "$BASE_SHA"..HEAD \
            | grep -E '(^|/)SKILL\.md$' \
            > .changed-skills.txt || true

          # Strip empty lines so `wc -l` is meaningful and xargs gets a
          # genuinely empty stream when nothing changed.
          sed -i '/^$/d' .changed-skills.txt

          COUNT=$(wc -l < .changed-skills.txt)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            echo "Changed SKILL.md files ($COUNT):"
            cat .changed-skills.txt
          else
            echo "No SKILL.md files changed in this PR."
          fi

      - name: Lint changed SKILL.md frontmatter
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: xargs -r node tools/linters/skill-frontmatter-linter.mjs < .changed-skills.txt

  performance-check:
    name: Validation Performance
    needs: validate-metadata
    runs-on: ubuntu-latest
    container: node:20
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Measure Validation Time
        run: |
          echo "Measuring validation performance..."
          START=$(date +%s%N)

          node --input-type=module -e "
            import { MetadataValidator } from './dist/src/plugin/metadata-validator.js';
            import path from 'path';

            async function benchmark() {
              const validator = new MetadataValidator({ checkFileReferences: false });
              const dirs = ['.claude/agents', '.claude/commands'];
              let fileCount = 0;

              for (const dir of dirs) {
                try {
                  const results = await validator.validateDirectory(path.resolve(process.cwd(), dir), true);
                  fileCount += results.size;
                } catch (e) {}
              }

              console.log('Files validated: ' + fileCount);
            }

            benchmark().catch(console.error);
          "

          END=$(date +%s%N)
          DURATION=$(( (END - START) / 1000000 ))

          echo "Validation completed in ${DURATION}ms"

          if [ $DURATION -gt 30000 ]; then
            echo "⚠ Warning: Validation took longer than 30s target"
          else
            echo "✓ Performance target met (<30s)"
          fi
