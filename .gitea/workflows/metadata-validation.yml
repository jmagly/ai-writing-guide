# Validate Framework Metadata
#
# Validates plugin and agent metadata schemas.
# Runs on changes to agentic framework files.
# Requires Node 20+ (hnswlib-node native addon not compatible with Node 18 EOL).

name: Validate Metadata

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - '.claude/**'
      - '.claude-plugin/**'
      - 'agentic/**'
      - 'src/plugin/**'
      - 'tools/workspace/**'
      - '.gitea/workflows/metadata-validation.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '.claude/**'
      - '.claude-plugin/**'
      - 'agentic/**'
      - 'src/plugin/**'
      - 'tools/workspace/**'
      - '.gitea/workflows/metadata-validation.yml'

concurrency:
  group: ci-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  validate-metadata:
    name: Validate Plugin Metadata
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    # Cold runners can spend most of the previous 10-minute budget installing
    # and building the full CLI before validation starts. Keep the gate strict,
    # but allow enough time for the validator to report an actual result.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install dependencies
        # --omit=optional skips runtime-optional features (embedding
        # index via @xenova/transformers + hnswlib-node, daemon PTY
        # bridge via node-pty, SQLite storage backend, hono serve
        # bridge, and Sigstore artifact verification). The metadata validator only needs fs/path/yaml/
        # semver/zod — all already in required deps. Avoids the
        # libvips download (transitive via @xenova → sharp) that
        # frequently times out from github.com on this runner.
        # Required deps + devDeps still install normally with full
        # install scripts.
        #
        # Code that imports optional deps (hono, @hono/node-server,
        # node-pty, @sigstore/*, etc.) MUST be guarded with `// @ts-ignore` and
        # wrapped in try/catch — see src/cli/handlers/serve.ts for
        # the auto-install pattern.
        run: npm ci --omit=optional

      - name: Build TypeScript
        run: |
          echo "Building TypeScript..."
          npm run build:cli 2>&1 || { echo "Build failed with exit code $?"; exit 1; }
          echo "Build completed."

      - name: Check dist directory
        run: ls -la dist/src/plugin/ || echo "dist/src/plugin/ directory does not exist"

      - name: Check marketplace.json version (PUW-038 #1139)
        run: |
          echo "Checking .claude-plugin/marketplace.json version is in lockstep with package.json..."
          # Pre-release tags allow stable-line match (rc.N drift accepted).
          # Stable tags require exact match.
          if [[ "${GITEA_REF:-}" == refs/tags/v* && "${GITEA_REF:-}" != *-rc.* && "${GITEA_REF:-}" != *-alpha.* && "${GITEA_REF:-}" != *-beta.* && "${GITEA_REF:-}" != *-nightly.* ]]; then
            node tools/workspace/check-marketplace-version.mjs
          else
            node tools/workspace/check-marketplace-version.mjs --allow-prerelease-mismatch
          fi

      - name: Validate Metadata Schema
        run: |
          echo "Validating plugin metadata..."
          node --input-type=module -e "
            import { MetadataValidator } from './dist/src/plugin/metadata-validator.js';
            import path from 'path';

            async function validateAll() {
              const validator = new MetadataValidator({
                checkFileReferences: true,
                strict: false
              });

              const dirs = [
                'agentic/code/frameworks/sdlc-complete/agents',
                'agentic/code/frameworks/sdlc-complete/commands'
              ];

              let totalErrors = 0;
              let totalWarnings = 0;
              let totalFiles = 0;

              const skipPatterns = ['manifest.md', 'README.md', 'agent-template.md', 'openai-compat.md', 'factory-compat.md'];

              for (const dir of dirs) {
                const dirPath = path.resolve(process.cwd(), dir);
                try {
                  const results = await validator.validateDirectory(dirPath, true);

                  for (const [file, result] of results) {
                    const basename = path.basename(file);
                    if (skipPatterns.includes(basename)) {
                      console.log('Skipping doc file: ' + basename);
                      continue;
                    }

                    totalFiles++;
                    if (!result.valid) {
                      totalErrors += result.errors.length;
                      console.log('\n❌ ' + file);
                      for (const error of result.errors) {
                        console.log('   Error: ' + error.message);
                      }
                    }
                    totalWarnings += result.warnings.length;
                  }
                } catch (e) {
                  console.log('Skipping ' + dir + ': ' + e.message);
                }
              }

              console.log('\n' + '='.repeat(50));
              console.log('Validation Summary:');
              console.log('  Files Validated: ' + totalFiles);
              console.log('  Errors:         ' + totalErrors);
              console.log('  Warnings:       ' + totalWarnings);
              console.log('='.repeat(50));

              if (totalErrors > 0) {
                console.log('\n❌ Metadata validation failed with ' + totalErrors + ' errors');
                process.exit(1);
              }

              console.log('\n✓ Metadata validation passed');
            }

            validateAll().catch(e => {
              console.error('Validation script error:', e);
              process.exit(1);
            });
          "

  validate-skill-frontmatter:
    name: Validate SKILL.md Frontmatter (full corpus)
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install js-yaml
        run: npm install --no-save js-yaml

      - name: Lint all SKILL.md frontmatter under agentic/code
        run: node tools/linters/skill-frontmatter-linter.mjs agentic/code

  performance-check:
    name: Validation Performance
    needs: validate-metadata
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install dependencies
        # --omit=optional skips runtime-optional features (embedding
        # index via @xenova/transformers + hnswlib-node, daemon PTY
        # bridge via node-pty, SQLite storage backend, hono serve
        # bridge, and Sigstore artifact verification). The metadata validator only needs fs/path/yaml/
        # semver/zod — all already in required deps. Avoids the
        # libvips download (transitive via @xenova → sharp) that
        # frequently times out from github.com on this runner.
        # Required deps + devDeps still install normally with full
        # install scripts.
        #
        # Code that imports optional deps (hono, @hono/node-server,
        # node-pty, @sigstore/*, etc.) MUST be guarded with `// @ts-ignore` and
        # wrapped in try/catch — see src/cli/handlers/serve.ts for
        # the auto-install pattern.
        run: npm ci --omit=optional

      - name: Build TypeScript
        run: npm run build:cli

      - name: Measure Validation Time
        run: |
          echo "Measuring validation performance..."
          START=$(date +%s%N)

          node --input-type=module -e "
            import { MetadataValidator } from './dist/src/plugin/metadata-validator.js';
            import path from 'path';

            async function benchmark() {
              const validator = new MetadataValidator({ checkFileReferences: false });
              const dirs = ['.claude/agents', '.claude/commands'];
              let fileCount = 0;

              for (const dir of dirs) {
                try {
                  const results = await validator.validateDirectory(path.resolve(process.cwd(), dir), true);
                  fileCount += results.size;
                } catch (e) {}
              }

              console.log('Files validated: ' + fileCount);
            }

            benchmark().catch(console.error);
          "

          END=$(date +%s%N)
          DURATION=$(( (END - START) / 1000000 ))

          echo "Validation completed in ${DURATION}ms"

          if [ $DURATION -gt 30000 ]; then
            echo "⚠ Warning: Validation took longer than 30s target"
          else
            echo "✓ Performance target met (<30s)"
          fi
