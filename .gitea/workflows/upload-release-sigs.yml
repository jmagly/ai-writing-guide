# Mirror Signed Release Assets from GitHub to Gitea Release
#
# Companion to .github/workflows/npm-publish.yml. The GitHub workflow
# cosign-signs the published tarball, release manifest, and CycloneDX
# SBOM, installer, checksum manifest, and signature bundles to the GitHub
# release. This workflow mirrors those release assets to the matching Gitea
# release.
#
# Asset list:
#   1. aiwg-X.Y.Z.tgz              (the tarball itself)
#   2. aiwg-X.Y.Z.tgz.sigstore     (cosign bundle for #1)
#   3. release-manifest.json       (provenance manifest)
#   4. release-manifest.json.sigstore   (cosign bundle for #3)
#   5. aiwg-X.Y.Z.cdx.json         (CycloneDX SBOM)
#   6. aiwg-X.Y.Z.cdx.json.sigstore     (cosign bundle for #5)
#
# Initial control set: #1287 / A8 (Wave 5 of #1278) added assets 1-4.
# A13 / #1288 (Wave 6) added assets 5-6.
#
# Why this is a separate workflow with a manual trigger:
# - The GitHub workflow runs on github.com; to push files into the
#   Gitea release directly it would need a Gitea write token in GitHub
#   secrets. Wave 4 (#1283, #1286) deliberately reduced the Gitea token
#   surface and the npmjs.org token surface; adding a new Gitea write
#   token in GitHub would push the wrong direction.
# - Releases on github.com/jmagly/aiwg are public, so the deterministic
#   release asset URLs can be downloaded without GitHub authentication.
# - The Gitea side fetches the release-asset upload token from vault.
#   Gitea stores only the VAULT_CI_ROLE_ID / VAULT_CI_SECRET_ID bootstrap pair.
# - The operator-side one-command ritual after each release is
#   documented in docs/contributing/versioning.md (the release runbook).
#
# Trigger: workflow_dispatch with a `tag` input, e.g. v2026.6.0.
#
# Companion controls:
# - .github/workflows/npm-publish.yml — the workflow that produces the
#   release assets in the first place.
# - .aiwg/architecture/adr-tarball-cosign-signing.md — A8 ADR with the
#   full rationale for the manual-trigger model.
# - docs/releases/verifying.md — consumer-facing verification docs.

name: Mirror signed release assets to Gitea release

env:
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}
  GT_RELEASE_TOKEN_VAULT_PATH: ${{ vars.GT_RELEASE_TOKEN_VAULT_PATH }}
  GT_RELEASE_TOKEN_VAULT_FIELD: ${{ vars.GT_RELEASE_TOKEN_VAULT_FIELD }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2026.6.0) — must already exist on both GitHub and Gitea releases'
        required: true
        type: string

concurrency:
  group: mirror-release-sigs-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  mirror-signed-assets:
    name: Mirror release assets to Gitea release
    if: ${{ secrets.VAULT_CI_ROLE_ID != '' && secrets.VAULT_CI_SECRET_ID != '' }}
    runs-on: ubuntu-latest
    # Same pinned container as the Gitea publish leg (see ci/digests.txt).
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout (for repo context only)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 (ci/digests.txt)
        with:
          fetch-depth: 1

      - name: Install jq + curl
        # node:20-bookworm ships curl but not jq. Pull from apt; the
        # base image is debian-bookworm so apt is available.
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl jq gnupg

      - name: Validate tag input
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "✗ tag input '$TAG' does not match vYYYY.M.PATCH[-pre] CalVer"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # File names produced by .github/workflows/npm-publish.yml.
          echo "tarball=aiwg-${VERSION}.tgz" >> "$GITHUB_OUTPUT"
          echo "tarball_sig=aiwg-${VERSION}.tgz.sigstore" >> "$GITHUB_OUTPUT"
          echo "manifest=release-manifest.json" >> "$GITHUB_OUTPUT"
          echo "manifest_sig=release-manifest.json.sigstore" >> "$GITHUB_OUTPUT"
          echo "sbom=aiwg-${VERSION}.cdx.json" >> "$GITHUB_OUTPUT"
          echo "sbom_sig=aiwg-${VERSION}.cdx.json.sigstore" >> "$GITHUB_OUTPUT"
          echo "installer=install.sh" >> "$GITHUB_OUTPUT"
          echo "checksums=SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Fetch Gitea release token from vault
        env:
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: bash ci/vault-fetch.sh --spec ci/vault-fetch.upload-release-sigs.spec

      - name: Download signed assets from GitHub release
        # github.com/jmagly/aiwg releases are public; use the deterministic
        # release asset URLs so this workflow does not need a GitHub token.
        run: |
          set -euo pipefail
          TAG='${{ steps.tag.outputs.tag }}'
          TARBALL='${{ steps.tag.outputs.tarball }}'
          TARBALL_SIG='${{ steps.tag.outputs.tarball_sig }}'
          MANIFEST='${{ steps.tag.outputs.manifest }}'
          MANIFEST_SIG='${{ steps.tag.outputs.manifest_sig }}'
          SBOM='${{ steps.tag.outputs.sbom }}'
          SBOM_SIG='${{ steps.tag.outputs.sbom_sig }}'
          INSTALLER='${{ steps.tag.outputs.installer }}'
          CHECKSUMS='${{ steps.tag.outputs.checksums }}'

          download_asset() {
            local name="$1"
            local url="https://github.com/jmagly/aiwg/releases/download/${TAG}/${name}"
            echo "  ↓ $name"
            curl -fsSL --retry 3 --retry-delay 2 -o "$name" "$url"
          }

          download_asset "$TARBALL"
          download_asset "$TARBALL_SIG"
          download_asset "$MANIFEST"
          download_asset "$MANIFEST_SIG"
          download_asset "$SBOM"
          download_asset "$SBOM_SIG"
          download_asset "$INSTALLER"
          download_asset "$CHECKSUMS"

          # Hard-check that all expected assets are present.
          MISSING=0
          for f in "$TARBALL" "$TARBALL_SIG" "$MANIFEST" "$MANIFEST_SIG" "$SBOM" "$SBOM_SIG" "$INSTALLER" "$CHECKSUMS"; do
            if [ ! -f "$f" ]; then
              echo "✗ Missing expected asset on GitHub release: $f"
              MISSING=1
            else
              echo "  ✓ Got $f ($(stat -c%s "$f") bytes)"
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo ""
            echo "Did the GitHub publish workflow run yet? Check:"
            echo "  https://github.com/jmagly/aiwg/releases/tag/$TAG"
            exit 1
          fi

      - name: Look up Gitea release ID
        id: gitea_release
        # The Gitea release API requires the numeric release ID, not the
        # tag name. Look it up via the tag-resolver endpoint.
        run: |
          set -euo pipefail
          TAG='${{ steps.tag.outputs.tag }}'
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/tags/${TAG}"
          HTTP_CODE=$(curl -s -o /tmp/release.json -w "%{http_code}" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Accept: application/json" \
            "$API")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "✗ Gitea release for tag $TAG not found (HTTP $HTTP_CODE)"
            cat /tmp/release.json
            echo ""
            echo "Did the gitea-release.yml workflow run yet? Check:"
            echo "  ${{ github.server_url }}/${{ github.repository }}/releases"
            exit 1
          fi
          RELEASE_ID=$(jq -r '.id' /tmp/release.json)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "✗ Release JSON did not contain a numeric id field"
            cat /tmp/release.json
            exit 1
          fi
          echo "Gitea release ID: $RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload signed assets to Gitea release
        # Gitea API: POST multipart/form-data to
        #   /api/v1/repos/{owner}/{repo}/releases/{id}/assets?name={filename}
        # Idempotency: the API rejects duplicate names with 409. The
        # script catches that and DELETEs the existing asset before
        # re-uploading, so re-running the workflow is safe.
        run: |
          set -euo pipefail
          RELEASE_ID='${{ steps.gitea_release.outputs.release_id }}'
          REPO_API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"

          upload_asset() {
            local file="$1"
            local name
            name=$(basename "$file")
            local url="${REPO_API}/releases/${RELEASE_ID}/assets?name=${name}"
            local code
            code=$(curl -s -o /tmp/upload.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Accept: application/json" \
              -F "attachment=@${file}" \
              "$url")
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then
              echo "  ✓ uploaded $name"
              return 0
            fi
            if [ "$code" = "409" ]; then
              echo "  ! $name already attached, deleting and re-uploading…"
              # Find existing asset id from the prior release JSON.
              local existing_id
              existing_id=$(jq -r --arg n "$name" '.assets[]? | select(.name == $n) | .id' /tmp/release.json)
              if [ -n "$existing_id" ] && [ "$existing_id" != "null" ]; then
                curl -s -o /dev/null -X DELETE \
                  -H "Authorization: token ${GITEA_TOKEN}" \
                  "${REPO_API}/releases/${RELEASE_ID}/assets/${existing_id}"
              fi
              code=$(curl -s -o /tmp/upload.json -w "%{http_code}" \
                -X POST \
                -H "Authorization: token ${GITEA_TOKEN}" \
                -H "Accept: application/json" \
                -F "attachment=@${file}" \
                "$url")
              if [ "$code" = "201" ] || [ "$code" = "200" ]; then
                echo "  ✓ re-uploaded $name"
                return 0
              fi
            fi
            echo "  ✗ upload of $name failed (HTTP $code)"
            cat /tmp/upload.json
            return 1
          }

          upload_asset '${{ steps.tag.outputs.tarball }}'
          upload_asset '${{ steps.tag.outputs.tarball_sig }}'
          upload_asset '${{ steps.tag.outputs.manifest }}'
          upload_asset '${{ steps.tag.outputs.manifest_sig }}'
          upload_asset '${{ steps.tag.outputs.sbom }}'
          upload_asset '${{ steps.tag.outputs.sbom_sig }}'
          upload_asset '${{ steps.tag.outputs.installer }}'
          upload_asset '${{ steps.tag.outputs.checksums }}'

      - name: Verify release assets land on Gitea release
        # Independent post-upload check. Re-fetch the release JSON and
        # confirm each expected filename is in .assets[].name.
        run: |
          set -euo pipefail
          TAG='${{ steps.tag.outputs.tag }}'
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/tags/${TAG}"
          curl -s -H "Authorization: token ${GITEA_TOKEN}" "$API" > /tmp/final.json
          MISSING=0
          for f in \
            '${{ steps.tag.outputs.tarball }}' \
            '${{ steps.tag.outputs.tarball_sig }}' \
            '${{ steps.tag.outputs.manifest }}' \
            '${{ steps.tag.outputs.manifest_sig }}' \
            '${{ steps.tag.outputs.sbom }}' \
            '${{ steps.tag.outputs.sbom_sig }}' \
            '${{ steps.tag.outputs.installer }}' \
            '${{ steps.tag.outputs.checksums }}'; do
            if ! jq -r '.assets[]?.name' /tmp/final.json | grep -qFx "$f"; then
              echo "  ✗ $f not present on Gitea release after upload"
              MISSING=1
            else
              echo "  ✓ $f attached"
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo ""
            echo "Final Gitea release asset list:"
            jq -r '.assets[]?.name' /tmp/final.json
            exit 1
          fi
          echo ""
          echo "✓ All release assets mirrored to Gitea release $TAG"
          echo "  Consumer verification: docs/releases/verifying.md"

      - name: Dispatch private web release pipeline
        # This is the only public-to-private coupling. The public workflow
        # supplies an immutable version after all signed assets are present;
        # verification, repackaging, signing, deployment, and entitlement
        # details remain owned by the private release-operations repository.
        #
        # The vault-provided Gitea token must have Actions write permission on
        # roctinam/aiwg-web-release-ops. A missing permission fails the release
        # handoff rather than silently leaving the web release unpublished.
        run: |
          set -euo pipefail
          set +x
          VERSION='${{ steps.tag.outputs.version }}'
          API="${{ github.server_url }}/api/v1/repos/roctinam/aiwg-web-release-ops/actions/workflows/web-release.yml/dispatches"
          PAYLOAD=$(jq -n --arg ref "refs/heads/main" --arg version "$VERSION" \
            '{ref: $ref, inputs: {version: $version}}')
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT INT TERM
          HTTP_CODE=$(env -u GITEA_TOKEN curl --config /dev/fd/3 \
            -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$API" \
            3<<<"header = \"Authorization: token ${GITEA_TOKEN}\"")
          if [ "$HTTP_CODE" != "204" ]; then
            echo "✗ Private web release dispatch failed (HTTP $HTTP_CODE)" >&2
            cat "$RESPONSE_FILE" >&2
            exit 1
          fi
          echo "✓ Dispatched private web release pipeline for AIWG $VERSION"
