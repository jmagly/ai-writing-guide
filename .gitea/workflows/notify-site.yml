# Notify aiwg.io of new release
#
# Post-publication callback for the private web-release pipeline. A tag push is
# intentionally not enough: aiwg.io may deploy only after the signed web
# release, adjacent attestations, and stable-channel freshness metadata exist.
#
# Required tracker secrets: VAULT_CI_ROLE_ID, VAULT_CI_SECRET_ID.
# vault fetch spec: ci/vault-fetch.notify-site.spec -> AIWG_IO_DISPATCH_TOKEN.

name: Notify aiwg.io

env:
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}
  AIWG_IO_DISPATCH_TOKEN_VAULT_PATH: ${{ vars.AIWG_IO_DISPATCH_TOKEN_VAULT_PATH }}
  AIWG_IO_DISPATCH_TOKEN_VAULT_FIELD: ${{ vars.AIWG_IO_DISPATCH_TOKEN_VAULT_FIELD }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Signed release tag whose exact setup and agentic YAML bytes were published'
        required: true
        type: string
      release_manifest_sha256:
        description: 'SHA-256 of the already-published, signed web release manifest (v1 or v2)'
        required: true
        type: string
      setup_attestation_sha256:
        description: 'SHA-256 of setup.aiwg.yaml.aiwg-attestation.json'
        required: true
        type: string
      setup_attestation_size:
        description: 'Exact byte length of setup.aiwg.yaml.aiwg-attestation.json'
        required: true
        type: string
      agentic_sha256:
        description: 'SHA-256 of the authoritative agentic.yaml bytes from the signed tag'
        required: true
        type: string
      agentic_attestation_sha256:
        description: 'SHA-256 of agentic.yaml.aiwg-attestation.json'
        required: true
        type: string
      agentic_attestation_size:
        description: 'Exact byte length of agentic.yaml.aiwg-attestation.json'
        required: true
        type: string
      channel_sequence:
        description: 'Monotonic stable-channel sequence committed by signed metadata'
        required: true
        type: string
      channel_expires_at:
        description: 'Stable-channel signed expiry in RFC 3339 form'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  trigger-deploy:
    name: Trigger aiwg.io deploy
    if: ${{ secrets.VAULT_CI_ROLE_ID != '' && secrets.VAULT_CI_SECRET_ID != '' }}
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout AIWG
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install vault fetch dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl jq gnupg

      - name: Fetch aiwg.io dispatch token from vault
        env:
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: bash ci/vault-fetch.sh --spec ci/vault-fetch.notify-site.spec

      - name: Dispatch aiwg.io deploy
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
          SETUP_ATTESTATION_SHA256: ${{ inputs.setup_attestation_sha256 }}
          SETUP_ATTESTATION_SIZE: ${{ inputs.setup_attestation_size }}
          AGENTIC_SHA256: ${{ inputs.agentic_sha256 }}
          AGENTIC_ATTESTATION_SHA256: ${{ inputs.agentic_attestation_sha256 }}
          AGENTIC_ATTESTATION_SIZE: ${{ inputs.agentic_attestation_size }}
          CHANNEL_SEQUENCE: ${{ inputs.channel_sequence }}
          CHANNEL_EXPIRES_AT: ${{ inputs.channel_expires_at }}
        run: |
          set -euo pipefail
          REF_NAME="$DISPATCH_TAG"
          if ! echo "$REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::release tag '$REF_NAME' is invalid"
            exit 1
          fi
          for digest in \
            "$RELEASE_MANIFEST_SHA256" \
            "$SETUP_ATTESTATION_SHA256" \
            "$AGENTIC_SHA256" \
            "$AGENTIC_ATTESTATION_SHA256"; do
            if ! echo "$digest" | grep -qE '^[0-9a-f]{64}$'; then
              echo "::error::publication callback contains an invalid SHA-256 descriptor"
              exit 1
            fi
          done
          for size in "$SETUP_ATTESTATION_SIZE" "$AGENTIC_ATTESTATION_SIZE"; do
            if ! echo "$size" | grep -qE '^[1-9][0-9]*$'; then
              echo "::error::attestation descriptor byte length must be a positive integer"
              exit 1
            fi
          done
          if ! echo "$CHANNEL_SEQUENCE" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::stable-channel sequence must be a positive integer"
            exit 1
          fi
          if ! echo "$CHANNEL_EXPIRES_AT" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?Z$'; then
            echo "::error::stable-channel expiry must use UTC RFC 3339 form"
            exit 1
          fi
          node -e '
            const expires = Date.parse(process.env.CHANNEL_EXPIRES_AT || "");
            if (!Number.isFinite(expires) || expires <= Date.now()) {
              console.error("::error::stable-channel expiry must be a future RFC 3339 timestamp");
              process.exit(1);
            }
          '

          # workflow_dispatch checks out the default branch, while tag pushes
          # may use a shallow checkout without the annotated tag object. Fetch
          # the exact tag in both cases, verify its maintainer signature, and
          # hash the manifest stored in that tag rather than the working tree.
          git fetch --force origin "refs/tags/${REF_NAME}:refs/tags/${REF_NAME}"
          AIWG_VERIFY_TAG_REF="refs/tags/${REF_NAME}" bash tools/ci/verify-signed-tag.sh
          # Dispatch the cross-repo deploy and FAIL LOUDLY on any non-2xx.
          # Prior implementation used `curl -s` without -f, which masked auth
          # failures — a revoked AIWG_IO_DISPATCH_TOKEN returned HTTP 401 with
          # `{"message":"invalid username, password or token"}` while the
          # workflow showed green. See aiwg#1348-followup (notify silent
          # failure post-supply-chain audit, 2026-05-15).
          if [ -z "${AIWG_IO_DISPATCH_TOKEN:-}" ]; then
            echo "::error::AIWG_IO_DISPATCH_TOKEN secret is unset"
            exit 1
          fi

          # Bind the callback to exact, independently reviewed setup and agent
          # handoff bytes from the signed release tag. Never synthesize or alias
          # either file here.
          git show "${REF_NAME}:setup.aiwg.yaml" > /tmp/setup.aiwg.yaml
          if ! git cat-file -e "${REF_NAME}:agentic.yaml" 2>/dev/null; then
            echo "::error::signed tag ${REF_NAME} is missing authoritative agentic.yaml; attested site publication is blocked"
            echo "::error::restore the reviewed repository-owned handoff manifest before retrying this callback"
            exit 1
          fi
          git show "${REF_NAME}:agentic.yaml" > /tmp/agentic.yaml
          SETUP_SHA256=$(sha256sum /tmp/setup.aiwg.yaml | awk '{print $1}')
          SETUP_SIZE=$(stat -c%s /tmp/setup.aiwg.yaml)
          TAG_AGENTIC_SHA256=$(sha256sum /tmp/agentic.yaml | awk '{print $1}')
          AGENTIC_SIZE=$(stat -c%s /tmp/agentic.yaml)
          if [ "$TAG_AGENTIC_SHA256" != "$AGENTIC_SHA256" ]; then
            echo "::error::agentic.yaml digest does not match the signed tag source"
            exit 1
          fi

          # This payload is discovery metadata, not verification evidence.
          # aiwg.io must verify the signed release manifest and exact descriptor
          # digests before publication; CDN headers never satisfy that check.
          PAYLOAD=$(jq -n \
            --arg ref "main" \
            --arg version "${REF_NAME}" \
            --arg source_tag "${REF_NAME}" \
            --arg contract_version "aiwg.site-publication/v1" \
            --arg release_manifest_sha256 "$RELEASE_MANIFEST_SHA256" \
            --arg setup_sha256 "${SETUP_SHA256}" \
            --arg setup_size "$SETUP_SIZE" \
            --arg setup_attestation_sha256 "$SETUP_ATTESTATION_SHA256" \
            --arg setup_attestation_size "$SETUP_ATTESTATION_SIZE" \
            --arg agentic_sha256 "$TAG_AGENTIC_SHA256" \
            --arg agentic_size "$AGENTIC_SIZE" \
            --arg agentic_attestation_sha256 "$AGENTIC_ATTESTATION_SHA256" \
            --arg agentic_attestation_size "$AGENTIC_ATTESTATION_SIZE" \
            --arg channel_sequence "$CHANNEL_SEQUENCE" \
            --arg channel_expires_at "$CHANNEL_EXPIRES_AT" \
            '{
              ref: $ref,
              inputs: {
                aiwg_version: $version,
                source_tag: $source_tag,
                publication_contract: ({
                  schemaVersion: $contract_version,
                  signedReleaseManifest: {
                    acceptedSchemaVersions: ["aiwg.resource-manifest/v1", "aiwg.resource-manifest/v2"],
                    sha256: $release_manifest_sha256
                  },
                  stableChannel: {
                    sequence: ($channel_sequence | tonumber),
                    expiresAt: $channel_expires_at
                  },
                  resources: [
                    {
                      path: "setup.aiwg.yaml",
                      size: ($setup_size | tonumber),
                      sha256: $setup_sha256,
                      mediaType: "application/yaml",
                      attestation: {
                        path: "setup.aiwg.yaml.aiwg-attestation.json",
                        size: ($setup_attestation_size | tonumber),
                        sha256: $setup_attestation_sha256,
                        mediaType: "application/vnd.aiwg.artifact-attestation.v1+json"
                      }
                    },
                    {
                      path: "agentic.yaml",
                      size: ($agentic_size | tonumber),
                      sha256: $agentic_sha256,
                      mediaType: "application/yaml",
                      attestation: {
                        path: "agentic.yaml.aiwg-attestation.json",
                        size: ($agentic_attestation_size | tonumber),
                        sha256: $agentic_attestation_sha256,
                        mediaType: "application/vnd.aiwg.artifact-attestation.v1+json"
                      }
                    }
                  ],
                  verification: {
                    requireSignedManifest: true,
                    httpMetadataIsNonAuthoritative: true
                  }
                } | tojson)
              }
            }')

          HTTP_STATUS=$(curl -sS -o /tmp/dispatch-body.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${AIWG_IO_DISPATCH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://git.integrolabs.net/api/v1/repos/roctinam/aiwg.io/actions/workflows/deploy.yml/dispatches" \
            -d "${PAYLOAD}")

          echo "Dispatch HTTP status: ${HTTP_STATUS}"
          # Workflow-dispatch returns 204 No Content on success.
          if [ "${HTTP_STATUS}" != "204" ]; then
            echo "::error::aiwg.io dispatch failed with HTTP ${HTTP_STATUS}"
            echo "Response body:"
            cat /tmp/dispatch-body.txt
            echo
            echo "If the body contains 'invalid username, password or token',"
            echo "rotate AIWG_IO_DISPATCH_TOKEN in roctinam/aiwg repo settings."
            exit 1
          fi

          echo "✓ attestation-aware aiwg.io deploy dispatched for ${REF_NAME}"
