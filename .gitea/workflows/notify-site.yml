# Notify aiwg.io of new release
#
# When a version tag is pushed, trigger a deploy of the aiwg.io marketing site
# so it picks up the latest release info (changelog, version refs).
#
# Required tracker secrets: VAULT_CI_ROLE_ID, VAULT_CI_SECRET_ID.
# vault fetch spec: ci/vault-fetch.notify-site.spec -> AIWG_IO_DISPATCH_TOKEN.

name: Notify aiwg.io

env:
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}
  AIWG_IO_DISPATCH_TOKEN_VAULT_PATH: ${{ vars.AIWG_IO_DISPATCH_TOKEN_VAULT_PATH }}
  AIWG_IO_DISPATCH_TOKEN_VAULT_FIELD: ${{ vars.AIWG_IO_DISPATCH_TOKEN_VAULT_FIELD }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (for notification recovery)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  trigger-deploy:
    name: Trigger aiwg.io deploy
    if: ${{ secrets.VAULT_CI_ROLE_ID != '' && secrets.VAULT_CI_SECRET_ID != '' }}
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout AIWG
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install vault fetch dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl jq

      - name: Fetch aiwg.io dispatch token from vault
        env:
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: bash ci/vault-fetch.sh --spec ci/vault-fetch.notify-site.spec

      - name: Dispatch aiwg.io deploy
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_REF_NAME: ${{ gitea.ref_name }}
        run: |
          set -euo pipefail
          REF_NAME="${DISPATCH_TAG:-$EVENT_REF_NAME}"
          if ! echo "$REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::release tag '$REF_NAME' is invalid"
            exit 1
          fi

          # workflow_dispatch checks out the default branch, while tag pushes
          # may use a shallow checkout without the annotated tag object. Fetch
          # the exact tag in both cases, verify its maintainer signature, and
          # hash the manifest stored in that tag rather than the working tree.
          git fetch --force origin "refs/tags/${REF_NAME}:refs/tags/${REF_NAME}"
          AIWG_VERIFY_TAG_REF="refs/tags/${REF_NAME}" bash tools/ci/verify-signed-tag.sh
          # Dispatch the cross-repo deploy and FAIL LOUDLY on any non-2xx.
          # Prior implementation used `curl -s` without -f, which masked auth
          # failures — a revoked AIWG_IO_DISPATCH_TOKEN returned HTTP 401 with
          # `{"message":"invalid username, password or token"}` while the
          # workflow showed green. See aiwg#1348-followup (notify silent
          # failure post-supply-chain audit, 2026-05-15).
          if [ -z "${AIWG_IO_DISPATCH_TOKEN:-}" ]; then
            echo "::error::AIWG_IO_DISPATCH_TOKEN secret is unset"
            exit 1
          fi

          # Bind the cross-repo deployment to the exact setup manifest bytes
          # from this signed release tag. aiwg.io verifies this digest before
          # publishing and again from the public URL after deployment.
          git show "${REF_NAME}:setup.aiwg.yaml" > /tmp/setup.aiwg.yaml
          SETUP_SHA256=$(sha256sum /tmp/setup.aiwg.yaml | awk '{print $1}')
          PAYLOAD=$(jq -n \
            --arg ref "main" \
            --arg version "${REF_NAME}" \
            --arg source_tag "${REF_NAME}" \
            --arg setup_sha256 "${SETUP_SHA256}" \
            '{ref: $ref, inputs: {aiwg_version: $version, source_tag: $source_tag, setup_sha256: $setup_sha256}}')

          HTTP_STATUS=$(curl -sS -o /tmp/dispatch-body.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${AIWG_IO_DISPATCH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://git.integrolabs.net/api/v1/repos/roctinam/aiwg.io/actions/workflows/deploy.yml/dispatches" \
            -d "${PAYLOAD}")

          echo "Dispatch HTTP status: ${HTTP_STATUS}"
          # Workflow-dispatch returns 204 No Content on success.
          if [ "${HTTP_STATUS}" != "204" ]; then
            echo "::error::aiwg.io dispatch failed with HTTP ${HTTP_STATUS}"
            echo "Response body:"
            cat /tmp/dispatch-body.txt
            echo
            echo "If the body contains 'invalid username, password or token',"
            echo "rotate AIWG_IO_DISPATCH_TOKEN in roctinam/aiwg repo settings."
            exit 1
          fi

          echo "✓ aiwg.io deploy dispatched for ${REF_NAME} (setup.aiwg.yaml ${SETUP_SHA256})"
