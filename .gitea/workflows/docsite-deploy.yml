# Doc Site Deploy
#
# Builds and deploys the documentation site to docs.aiwg.io.
#
# Triggers:
#   1. Release tags (v*) — full release-aligned deploy with per-tag verify
#   2. Pushes to main that change docs/ or this workflow — docs-only deploys
#      between releases (no new version, no announcement, no tag)
#   3. workflow_dispatch — manual operator-initiated deploy
#
# Required tracker secrets: VAULT_CI_ROLE_ID, VAULT_CI_SECRET_ID.
# Required tracker variables: DOCSITE_DEPLOY_HOST, DOCSITE_DEPLOY_PORT, DOCSITE_DEPLOY_USER, DOCSITE_DEPLOY_PATH.
# vault fetch spec: ci/vault-fetch.docsite-deploy.spec -> DOCSITE_DEPLOY_KEY_FILE.
# (GT_ACCESS_TOKEN no longer required — publisher comes from npm, not a clone; #1484)

name: Docsite Deploy

env:
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}
  DOCSITE_DEPLOY_KEY_VAULT_PATH: ${{ vars.DOCSITE_DEPLOY_KEY_VAULT_PATH }}
  DOCSITE_DEPLOY_KEY_VAULT_FIELD: ${{ vars.DOCSITE_DEPLOY_KEY_VAULT_FIELD }}
  CLOUDFLARE_API_TOKEN_VAULT_PATH: ${{ vars.CLOUDFLARE_API_TOKEN_VAULT_PATH }}
  CLOUDFLARE_API_TOKEN_VAULT_FIELD: ${{ vars.CLOUDFLARE_API_TOKEN_VAULT_FIELD }}

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'                       # version footer substitution
      - '.gitea/workflows/docsite-deploy.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you triggering this deploy? (logged to job output)'
        required: false
        type: string
        default: 'Manual docs deploy'

concurrency:
  # Single group across tag releases and docs-only deploys so they
  # serialize and never race against each other on the same target.
  group: docsite-deploy
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Build & Deploy Documentation
    if: ${{ secrets.VAULT_CI_ROLE_ID != '' && secrets.VAULT_CI_SECRET_ID != '' }}
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 30
    # Force bash so `set -o pipefail` works (gitea-runner-host default is sh/dash).
    defaults:
      run:
        shell: bash
    env:
      # docs.aiwg.io is now a shared static host. AIWG deploys still own the
      # root tenant, but must not delete tenant subtrees managed by sibling repos.
      # Sibling tenants are built and deployed by their owning repositories.
      # AIWG owns the domain root, while the rsync receiver-protect filters below
      # preserve each explicitly registered subtree from this deploy's --delete.
      # pagenary 2026.6.3+ emits subpath-relative shell assets (./-relative plus
      # a build-injected <base href>) for tenants served below the docs domain.
      PROTECTED_DOCS_SUBPATHS: agentic-sandbox payments.roko.network clowder.roko.network

    steps:
      - name: Checkout AIWG
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # The doc-site publisher is consumed from npm as the `@pagenary/publisher`
      # devDependency (bin: `pagenary`); no git clone, no GT_ACCESS_TOKEN.
      # Migration: #1484. Output minification is built into pagenary as of
      # 2026.6.13 (roctinam/pagenary#14, `build.config.json: minify`), so the
      # previous `terser` devDependency was dropped — no separate minify step.
      - name: Install dependencies
        run: npm ci

      - name: Configure tenant
        run: |
          # strictLinks:false — deploy is lenient on broken links (the build
          # validation gate owns link-strictness; see docsite-build.yml + #1486).
          cat > "${{ gitea.workspace }}/tenants.json" <<'TENANTS'
          {
            "tenants": [
              {
                "id": "aiwg-docs",
                "enabled": true,
                "source": { "type": "local", "path": "./dist/public-docs-source" },
                "target": { "type": "local", "path": "./dist/aiwg-docs" },
                "domains": ["docs.aiwg.io"],
                "strictLinks": false
              }
            ]
          }
          TENANTS

      - name: Substitute version placeholder in docs overrides
        run: |
          set -euo pipefail
          # The footer in docs/overrides/index.html references the current
          # AIWG version via the placeholder __AIWG_VERSION__. Substitute
          # the actual version from package.json before pagenary reads
          # the overrides directory. This keeps the source template free
          # of per-release manual edits — see aiwg#1348-followup (docs
          # footer hardcoded to v5.0 surfaced 2026-05-15).
          AIWG_VERSION="v$(node -p "require('./package.json').version")"
          echo "Substituting __AIWG_VERSION__ -> ${AIWG_VERSION} in docs/overrides/"
          # macOS-portable in-place sed via -i.bak then rm; this runs on
          # Linux runner so the GNU-style -i would also work, but the
          # explicit form avoids a future portability surprise.
          sed -i.bak "s/__AIWG_VERSION__/${AIWG_VERSION}/g" docs/overrides/index.html
          rm -f docs/overrides/index.html.bak
          # Fail-loud if the placeholder is still present somewhere we
          # missed — prevents shipping a literal "__AIWG_VERSION__" to
          # production.
          if grep -q "__AIWG_VERSION__" docs/overrides/index.html; then
            echo "::error::__AIWG_VERSION__ placeholder still present in docs/overrides/index.html after substitution"
            exit 1
          fi
          # Confirm the version actually landed.
          if ! grep -q "${AIWG_VERSION}" docs/overrides/index.html; then
            echo "::error::Substitution did not write ${AIWG_VERSION} into docs/overrides/index.html"
            exit 1
          fi
          echo "✓ Version substitution complete"

      - name: Build doc site
        run: |
          node tools/docs/build-public-source.mjs
          node tools/docs/audit-audiences.mjs
          node -e "const p=require('./dist/docs-audience-audit.json'); if(!p.totals.agentReferenceFiles) process.exit(1)"
          npx pagenary build:tenants aiwg-docs
          node tools/docs/write-blog-static-pages.mjs dist/aiwg-docs
          # A unique, root-tenant-owned marker lets the public verification
          # distinguish this deployment from a stale edge response.
          printf '%s\n' "${{ gitea.sha }}" > "dist/aiwg-docs/aiwg-deploy-${{ gitea.sha }}.txt"

      - name: Verify build output
        run: |
          set -euo pipefail
          OUT="${{ gitea.workspace }}/dist/aiwg-docs"
          test -d "$OUT" || { echo "::error::Missing build output directory $OUT"; exit 1; }
          test -f "$OUT/index.html" || { echo "::error::Missing index.html"; exit 1; }
          test -f "$OUT/blog/index.html" || { echo "::error::Missing blog/index.html"; exit 1; }
          test -d "$OUT/sections" || { echo "::error::Missing sections/ — refusing to deploy (would rsync --delete an incomplete site)"; exit 1; }
          if find "$OUT" -type f \( -path '*/agents/*' -o -name 'agents--*.js' \) | grep -q .; then
            echo "::error::agent-reference material leaked into docs.aiwg.io output"
            exit 1
          fi
          echo "Build verification passed"
          ls -lah "$OUT/"

      - name: Install SSH tools
        run: |
          # Some runner networks reject Debian's legacy HTTP mirror response
          # with apt's NOSPLIT error. Use authenticated HTTPS transport.
          sed -i 's|http://deb.debian.org|https://deb.debian.org|g' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends curl jq openssh-client rsync

      - name: Fetch docs deploy key from vault
        env:
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: bash ci/vault-fetch.sh --spec ci/vault-fetch.docsite-deploy.spec

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          cp "${DOCSITE_DEPLOY_KEY_FILE}" ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to docs server
        env:
          DOCSITE_DEPLOY_PATH: ${{ vars.DOCSITE_DEPLOY_PATH }}
          DOCSITE_DEPLOY_USER: ${{ vars.DOCSITE_DEPLOY_USER }}
          DOCSITE_DEPLOY_HOST: ${{ vars.DOCSITE_DEPLOY_HOST }}
          DOCSITE_DEPLOY_PORT: ${{ vars.DOCSITE_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -p "${DOCSITE_DEPLOY_PORT}"
            -o StrictHostKeyChecking=accept-new
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          DEPLOY_ROOT="${DOCSITE_DEPLOY_PATH%/}/"
          # rsync/ssh do NOT reliably expand `~` — a single-quoted `~/...` reaches
          # the remote `mkdir`/rsync literally and creates a directory named `~`
          # under $HOME (this is what silently froze docs.aiwg.io at v2026.5.10:
          # deploys landed in ~/<literal-~>/production-deploy/... while Caddy served
          # the real ~/production-deploy/...). Resolve any non-absolute or `~` path
          # against the remote $HOME explicitly. POSIX `case` — `[[ ]]` misbehaves
          # under dash and was not firing here.
          case "$DEPLOY_ROOT" in
            /*) : ;;  # already absolute — use as-is
            *)
              REMOTE_HOME="$(ssh "${SSH_OPTS[@]}" "${DOCSITE_DEPLOY_USER}@${DOCSITE_DEPLOY_HOST}" 'printf %s "$HOME"')"
              # Strip a single leading literal ~ (escaped \~ so the strip pattern is
              # not itself tilde-expanded), then a single leading /, then anchor to
              # the remote $HOME. Handles ~/path, bare ~, and relative path. A quoted
              # "~/"* case pattern does NOT match here, which is the bug that let the
              # literal ~ through — strip-based resolution is the reliable form.
              rest="${DEPLOY_ROOT#\~}"
              rest="${rest#/}"
              DEPLOY_ROOT="${REMOTE_HOME}/${rest}"
              ;;
          esac
          echo "Deploying docsite to ${DEPLOY_ROOT}"
          RSYNC_PROTECT_ARGS=()
          for subpath in ${PROTECTED_DOCS_SUBPATHS}; do
            clean="${subpath#/}"
            clean="${clean%/}"
            if [[ -z "${clean}" || "${clean}" == *".."* || "${clean}" == *"*"* ]]; then
              echo "::error::Invalid protected docs subpath: ${subpath}"
              exit 1
            fi
            echo "Protecting shared docs tenant /${clean}/ from rsync deletion"
            RSYNC_PROTECT_ARGS+=(--filter "P /${clean}/***")
          done
          ssh "${SSH_OPTS[@]}" "${DOCSITE_DEPLOY_USER}@${DOCSITE_DEPLOY_HOST}" \
            "mkdir -p '${DEPLOY_ROOT}'"

          # Dry-run first so the job fails before mutation if a protected
          # tenant subtree would be deleted. The receiver-protect filters are
          # kept on the real sync below.
          rsync -avzn --delete --timeout=60 \
            "${RSYNC_PROTECT_ARGS[@]}" \
            -e "ssh -i ~/.ssh/deploy_key -p ${DOCSITE_DEPLOY_PORT} -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
            "${{ gitea.workspace }}/dist/aiwg-docs/" \
            "${DOCSITE_DEPLOY_USER}@${DOCSITE_DEPLOY_HOST}:${DEPLOY_ROOT}" | tee /tmp/docsite-rsync-plan.txt
          for subpath in ${PROTECTED_DOCS_SUBPATHS}; do
            clean="${subpath#/}"
            clean="${clean%/}"
            if grep -E "^\\*deleting +${clean}(/|$)" /tmp/docsite-rsync-plan.txt; then
              echo "::error::Rsync dry-run would delete protected docs tenant /${clean}/"
              exit 1
            fi
          done

          rsync -avz --delete --timeout=60 \
            "${RSYNC_PROTECT_ARGS[@]}" \
            -e "ssh -i ~/.ssh/deploy_key -p ${DOCSITE_DEPLOY_PORT} -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
            "${{ gitea.workspace }}/dist/aiwg-docs/" \
            "${DOCSITE_DEPLOY_USER}@${DOCSITE_DEPLOY_HOST}:${DEPLOY_ROOT}"
          ssh "${SSH_OPTS[@]}" "${DOCSITE_DEPLOY_USER}@${DOCSITE_DEPLOY_HOST}" \
            "set -e
             if [ ! -d '${DEPLOY_ROOT}sections' ]; then
               echo '::error::Rsync completed but sections/ is missing at ${DEPLOY_ROOT}'
               echo 'Nearby sections directories under deploy root:'
               find '${DEPLOY_ROOT}' -maxdepth 3 -type d -name sections -print 2>/dev/null || true
               exit 1
             fi"

      - name: Verify deployment
        env:
          DOCSITE_DEPLOY_PATH: ${{ vars.DOCSITE_DEPLOY_PATH }}
          DOCSITE_DEPLOY_USER: ${{ vars.DOCSITE_DEPLOY_USER }}
          DOCSITE_DEPLOY_HOST: ${{ vars.DOCSITE_DEPLOY_HOST }}
          DOCSITE_DEPLOY_PORT: ${{ vars.DOCSITE_DEPLOY_PORT }}
          GITEA_REF: ${{ gitea.ref }}
          GITEA_REF_NAME: ${{ gitea.ref_name }}
          GITEA_EVENT_NAME: ${{ gitea.event_name }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -p "${DOCSITE_DEPLOY_PORT}"
            -o StrictHostKeyChecking=accept-new
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          DEPLOY_ROOT="${DOCSITE_DEPLOY_PATH%/}/"
          # rsync/ssh do NOT reliably expand `~` — a single-quoted `~/...` reaches
          # the remote `mkdir`/rsync literally and creates a directory named `~`
          # under $HOME (this is what silently froze docs.aiwg.io at v2026.5.10:
          # deploys landed in ~/<literal-~>/production-deploy/... while Caddy served
          # the real ~/production-deploy/...). Resolve any non-absolute or `~` path
          # against the remote $HOME explicitly. POSIX `case` — `[[ ]]` misbehaves
          # under dash and was not firing here.
          case "$DEPLOY_ROOT" in
            /*) : ;;  # already absolute — use as-is
            *)
              REMOTE_HOME="$(ssh "${SSH_OPTS[@]}" "${DOCSITE_DEPLOY_USER}@${DOCSITE_DEPLOY_HOST}" 'printf %s "$HOME"')"
              # Strip a single leading literal ~ (escaped \~ so the strip pattern is
              # not itself tilde-expanded), then a single leading /, then anchor to
              # the remote $HOME. Handles ~/path, bare ~, and relative path. A quoted
              # "~/"* case pattern does NOT match here, which is the bug that let the
              # literal ~ through — strip-based resolution is the reliable form.
              rest="${DEPLOY_ROOT#\~}"
              rest="${rest#/}"
              DEPLOY_ROOT="${REMOTE_HOME}/${rest}"
              ;;
          esac
          echo "Verifying docsite at ${DEPLOY_ROOT}"

          # Two verify modes:
          #   - Tag mode (refs/tags/v*): existing per-release section-file
          #     check — confirms docs/releases/<tag>-announcement.md was
          #     built into sections/releases--<tag>-announcement.js and
          #     landed on the served path.
          #   - Branch / dispatch mode: docs-only deploy between releases.
          #     No new section file is expected. Confirm the SPA shell
          #     (index.html) and the sections/ directory are present.
          if [[ "$GITEA_REF" == refs/tags/* ]]; then
            MODE=tag
            SECTION_FILE="sections/releases--${GITEA_REF_NAME}-announcement.js"
            echo "Verify mode: tag — checking ${SECTION_FILE}"
            ssh "${SSH_OPTS[@]}" "${DOCSITE_DEPLOY_USER}@${DOCSITE_DEPLOY_HOST}" \
              "if [ -f '${DEPLOY_ROOT}${SECTION_FILE}' ]; then
                 echo 'Deploy verified: ${SECTION_FILE} is on disk for ${GITEA_REF_NAME}'
               else
                 echo '::error::No section file for ${GITEA_REF_NAME} at ${DEPLOY_ROOT}${SECTION_FILE}'
                 echo '  Either:'
                 echo '  - docs/releases/${GITEA_REF_NAME}-announcement.md did not exist when this tag was built'
                 echo '  - pagenary did not generate the section (check build logs upstream)'
                 echo '  - rsync target differs from served path (check webserver doc root vs DEPLOY_ROOT)'
                 exit 1
               fi
               if [ -f '${DEPLOY_ROOT}index.html' ]; then
                 echo 'index.html present.'
               else
                 echo '::warning::${DEPLOY_ROOT}index.html missing; release section deployed, but SPA shell appears to be managed outside DEPLOY_ROOT or by the edge/frontend layer.'
               fi"
          else
            MODE=docs-only
            echo "Verify mode: docs-only (ref=${GITEA_REF}, event=${GITEA_EVENT_NAME})"
            ssh "${SSH_OPTS[@]}" "${DOCSITE_DEPLOY_USER}@${DOCSITE_DEPLOY_HOST}" \
              "set -e
               if [ -f '${DEPLOY_ROOT}index.html' ]; then
                 echo 'index.html present.'
               else
                 echo '::warning::${DEPLOY_ROOT}index.html missing; docs sections deployed, but SPA shell appears to be managed outside DEPLOY_ROOT or by the edge/frontend layer.'
               fi
               if [ ! -d '${DEPLOY_ROOT}sections' ]; then
                 echo '::error::No sections/ directory at ${DEPLOY_ROOT} — pagenary output not deployed'
                 exit 1
               fi
               SECTION_COUNT=\$(ls '${DEPLOY_ROOT}sections' | wc -l)
               echo \"Docs-only deploy verified: index.html present, sections/ has \${SECTION_COUNT} entries.\"
               echo 'Sample section files:'
               ls '${DEPLOY_ROOT}sections' | head -5"
          fi
          echo "Verify completed (mode: ${MODE})"

      - name: Fetch Cloudflare purge token from vault
        env:
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ] || \
             [ -z "${CLOUDFLARE_API_TOKEN_VAULT_PATH:-}" ] || \
             [ -z "${CLOUDFLARE_API_TOKEN_VAULT_FIELD:-}" ]; then
            echo "::notice::Docsite deployed with degraded CDN status: scoped purge credentials are not configured; cached content may remain until TTL"
            exit 0
          fi
          if ! bash ci/vault-fetch.sh --spec ci/vault-fetch.docsite-cloudflare.spec; then
            echo "::warning::Docsite deployed with degraded CDN status: Cloudflare token fetch failed; cached content may remain until TTL"
            exit 0
          fi

      - name: Purge root-tenant Cloudflare URLs
        id: purge
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::notice::Docsite deployed with degraded CDN status: scoped purge skipped because CLOUDFLARE_ZONE_ID or the API token is unavailable"
            echo "performed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          OUT="${{ gitea.workspace }}/dist/aiwg-docs"
          BASE="https://docs.aiwg.io"
          export OUT BASE PROTECTED_DOCS_SUBPATHS
          # Derive every URL from the files just deployed. The generator fixes
          # the only permitted hostname and rejects any protected first path
          # segment before a request can be constructed.
          node <<'NODE' > /tmp/docsite-purge-urls.txt
          const { readdirSync, statSync } = require('node:fs');
          const { join, relative, sep } = require('node:path');
          const out = process.env.OUT;
          const base = new URL(process.env.BASE);
          if (base.protocol !== 'https:' || base.hostname !== 'docs.aiwg.io' || base.pathname !== '/') {
            throw new Error(`refusing non-root purge base: ${base.href}`);
          }
          const protectedPaths = new Set(process.env.PROTECTED_DOCS_SUBPATHS.split(/\s+/).filter(Boolean));
          const files = [];
          const walk = (dir) => {
            for (const name of readdirSync(dir)) {
              const path = join(dir, name);
              statSync(path).isDirectory() ? walk(path) : files.push(relative(out, path).split(sep));
            }
          };
          walk(out);
          const urls = new Set([base.href, new URL('index.html', base).href]);
          for (const parts of files) {
            if (protectedPaths.has(parts[0])) throw new Error(`protected tenant entered root output: ${parts.join('/')}`);
            const encoded = parts.map(encodeURIComponent).join('/');
            const url = new URL(encoded, base);
            if (url.protocol !== 'https:' || url.hostname !== 'docs.aiwg.io') throw new Error(`unowned purge URL: ${url.href}`);
            urls.add(url.href);
            // Web servers also expose each nested index.html at its directory
            // alias. Purge that canonical alias without broadening ownership.
            if (parts.at(-1) === 'index.html') {
              const directory = parts.slice(0, -1).map(encodeURIComponent).join('/');
              urls.add(new URL(directory ? `${directory}/` : '/', base).href);
            }
          }
          process.stdout.write([...urls].sort().join('\n') + '\n');
          NODE
          count=$(wc -l < /tmp/docsite-purge-urls.txt)
          echo "Purging ${count} root-tenant URL(s) on ${BASE} in batches of 30"
          api="https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache"
          tmp_prefix="/tmp/docsite-purge-batch-"
          trap 'rm -f /tmp/docsite-purge-urls.txt /tmp/docsite-purge-batch-* /tmp/docsite-purge-response.json' EXIT
          split -l 30 /tmp/docsite-purge-urls.txt "$tmp_prefix"
          n=0
          for batch in ${tmp_prefix}*; do
            n=$((n + 1))
            body=$(jq -R . "$batch" | jq -sc '{files: .}')
            status=$(curl --show-error --silent --max-time 30 \
              --output /tmp/docsite-purge-response.json --write-out '%{http_code}' \
              -X POST "$api" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$body")
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Cloudflare purge batch ${n} returned HTTP ${status}: $(jq -c '.errors // .' /tmp/docsite-purge-response.json 2>/dev/null || true)"
              exit 1
            fi
            if ! jq -e '.success == true' /tmp/docsite-purge-response.json >/dev/null; then
              echo "::error::Cloudflare purge batch ${n} returned success=false: $(jq -c '.errors // .' /tmp/docsite-purge-response.json)"
              exit 1
            fi
            echo "  batch ${n}: purged $(wc -l < "$batch") URL(s)"
          done
          echo "performed=true" >> "${GITHUB_OUTPUT}"
          echo "Cloudflare root-tenant cache purge complete"

      - name: Verify public content after scoped purge
        if: steps.purge.outputs.performed == 'true'
        env:
          DEPLOY_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          marker_url="https://docs.aiwg.io/aiwg-deploy-${DEPLOY_SHA}.txt"
          headers=$(mktemp)
          body=$(mktemp)
          trap 'rm -f "$headers" "$body"' EXIT
          curl --fail --show-error --silent --max-time 30 --retry 3 --retry-delay 2 \
            --dump-header "$headers" --output "$body" "$marker_url"
          if [ "$(tr -d '\r\n' < "$body")" != "$DEPLOY_SHA" ]; then
            echo "::error::Public deployment marker does not match ${DEPLOY_SHA}"
            exit 1
          fi
          if ! grep -qi '^cache-control:' "$headers"; then
            echo "::error::Public deployment marker response is missing Cache-Control"
            exit 1
          fi
          if ! grep -qi '^etag:' "$headers"; then
            echo "::error::Public deployment marker response is missing ETag"
            exit 1
          fi
          etag=$(awk 'tolower($0) ~ /^etag:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")
          conditional_status=$(curl --show-error --silent --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            -H "If-None-Match: ${etag}" "$marker_url")
          if [ "$conditional_status" != "304" ]; then
            echo "::error::Public deployment marker ETag did not produce HTTP 304 (got ${conditional_status})"
            exit 1
          fi
          echo "Public marker, Cache-Control, and ETag/304 verification passed for ${DEPLOY_SHA}"

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          bash ci/vault-fetch.sh --cleanup

      - name: Log deployment result
        if: success()
        env:
          DISPATCH_REASON: ${{ inputs.reason }}
          GITEA_EVENT_NAME: ${{ gitea.event_name }}
        run: |
          echo "Deployed docs.aiwg.io"
          echo "Ref: ${{ gitea.ref }}"
          echo "Commit: ${{ gitea.sha }}"
          echo "Event: ${GITEA_EVENT_NAME}"
          if [ "${GITEA_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${DISPATCH_REASON}" ]; then
            echo "Reason: ${DISPATCH_REASON}"
          fi
