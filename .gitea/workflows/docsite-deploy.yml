# Doc Site Deploy
#
# Builds and deploys the documentation site on new release tags.
# Runs independently from npm-publish and gitea-release workflows.
#
# Required secrets: GT_ACCESS_TOKEN, SSH_DEPLOY_KEY, DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_PATH

name: Docsite Deploy

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 15
    # Force bash so `set -o pipefail` works (gitea-runner-host default is sh/dash).
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout AIWG
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Clone dbbuilder
        env:
          GT_ACCESS_TOKEN: ${{ secrets.GT_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Token lives in a transient mode-600 file consumed by git's
          # credential helper. Avoids exposing the token in process
          # arguments (visible to `ps`, core dumps, error output) which
          # was the case with the previous token-in-URL pattern.
          # See .claude/rules/token-security.md rule 2 and #1284 (A6).
          GIT_CREDS="$(mktemp)"
          chmod 600 "$GIT_CREDS"
          trap 'rm -f "$GIT_CREDS"' EXIT
          printf 'https://token:%s@git.integrolabs.net\n' "${GT_ACCESS_TOKEN}" > "$GIT_CREDS"
          git -c "credential.helper=store --file=$GIT_CREDS" \
            clone https://git.integrolabs.net/roctinam/dbbuilder.git /tmp/dbbuilder

      - name: Install dbbuilder dependencies
        working-directory: /tmp/dbbuilder/apps/publisher
        run: npm ci

      - name: Configure tenant
        run: |
          cat > /tmp/dbbuilder/apps/publisher/tenants.json <<'TENANTS'
          {
            "$schema": "./tenants.schema.json",
            "tenants": [
              {
                "id": "aiwg-docs",
                "source": {
                  "type": "local",
                  "path": "${{ gitea.workspace }}/docs"
                },
                "domains": ["docs.aiwg.io"],
                "strictLinks": false
              }
            ]
          }
          TENANTS

      - name: Build doc site
        working-directory: /tmp/dbbuilder/apps/publisher
        run: node scripts/build-tenants.js aiwg-docs

      - name: Verify build output
        run: |
          test -d /tmp/dbbuilder/apps/publisher/dist/aiwg-docs || { echo "Missing build output directory"; exit 1; }
          test -f /tmp/dbbuilder/apps/publisher/dist/aiwg-docs/index.html || { echo "Missing index.html"; exit 1; }
          echo "Build verification passed"
          ls -lah /tmp/dbbuilder/apps/publisher/dist/aiwg-docs/

      - name: Install SSH tools
        run: apt-get update && apt-get install -y --no-install-recommends openssh-client rsync

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to docs server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=accept-new" \
            /tmp/dbbuilder/apps/publisher/dist/aiwg-docs/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Verify deployment
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          EXPECTED_TAG: ${{ gitea.ref_name }}
        run: |
          set -euo pipefail
          # CONTENT verification, not just presence. The original verify
          # only checked that index.html exists, which left a silent
          # failure mode — if the served directory diverges from
          # DEPLOY_PATH (CDN, reverse proxy pointing elsewhere, stale
          # publish step), rsync writes the new content but the public
          # site still serves the old. See aiwg#1348-followup
          # (docs.aiwg.io stuck at v2026.5.0 despite green deploys,
          # 2026-05-15).
          echo "Verifying ${EXPECTED_TAG} is present in ${DEPLOY_PATH}index.html"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "test -f '${DEPLOY_PATH}index.html' || { echo '::error::Deploy failed: ${DEPLOY_PATH}index.html missing'; exit 1; }
             if grep -qF '${EXPECTED_TAG}' '${DEPLOY_PATH}index.html' '${DEPLOY_PATH}releases.html' 2>/dev/null; then
               echo 'Deploy verified: ${EXPECTED_TAG} referenced in served HTML'
             else
               echo '::warning::index.html exists but does NOT reference ${EXPECTED_TAG} —'
               echo '  rsync may have written to a different path than the webserver serves.'
               echo '  Check webserver document root vs ${DEPLOY_PATH}, CDN cache, or any'
               echo '  publish/promote step the server expects between rsync and serve.'
               exit 1
             fi"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Log deployment result
        if: success()
        run: |
          echo "Deployed docs.aiwg.io"
          echo "Tag: ${{ gitea.ref }}"
          echo "Commit: ${{ gitea.sha }}"
