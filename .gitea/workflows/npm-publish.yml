# npm Package Publishing to Gitea and Public npm Registries
#
# Publishes the package to both Gitea's npm registry and public npmjs.org
# when a version tag is pushed. Uses CalVer versioning: vYYYY.M.PATCH
#
# REQUIRED SECRETS:
#   NPM_TOKEN    - **Gitea API token** (gta_...) with package:write scope on
#                  Gitea's bundled npm registry, plus repository:write so the
#                  same token can also drive gitea-release.yml. Despite the
#                  name, this is NOT an npmjs.org token — the legacy name is
#                  preserved by operator preference.
#   NPMJS_TOKEN  - npmjs.org granular access token (npm_...). Bypasses 2FA
#                  for CI. Must have read+write scope on the `aiwg` package
#                  under the npmjs.org account that owns it.
#
# To publish a new version:
#   1. Update version in package.json
#   2. Commit: git commit -am "release: vYYYY.M.PATCH"
#   3. Tag: git tag vYYYY.M.PATCH
#   4. Push: git push origin main --tags
#
# Note:
# - Gitea release creation is handled by .gitea/workflows/gitea-release.yml
# - GitHub release creation is manual via `gh release ...`

name: Publish to npm registries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish)'
        required: false
        default: 'false'
        type: boolean
      skip_public:
        description: 'Skip publishing to public npmjs.org'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

env:
  GITEA_NPM_REGISTRY: https://git.integrolabs.net/api/packages/roctinam/npm/
  NODE_VERSION: '20'

jobs:
  build-and-publish-prerelease:
    name: Build and Publish Pre-release
    # Publish pre-release tags (nightly, alpha, beta) — nightly → --tag nightly, others → --tag next
    if: ${{ contains(github.ref, '-') && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 15
    # Force bash so `set -o pipefail` works (gitea-runner-host default is sh/dash).
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # Needed so `git tag -v` can see the tag annotation (signature).
          # Default fetch-depth: 1 omits tag objects; tag-triggered runs
          # land on the commit but not necessarily with the tag object.
          fetch-tags: true

      - name: Verify signed tag (#1299 / A9 gate)
        # Hard gate: every release tag must verify against a maintainer
        # public key published in .gitea/keys/ or .gitea/allowed_signers.
        # See tools/ci/verify-signed-tag.sh for the full procedure and
        # docs/contributing/versioning.md for the operator setup.
        run: bash tools/ci/verify-signed-tag.sh

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Build TypeScript
        run: npm run build

      - name: Set pre-release version in package.json
        id: rcversion
        run: |
          NPM_VERSION=$(node -p "require('./package.json').version")
          # Determine npm dist-tag: nightly gets its own channel; others go to next
          if echo "$NPM_VERSION" | grep -qiE '\-nightly\.'; then
            NPM_TAG=nightly
          else
            NPM_TAG=next
          fi
          echo "npm_version=$NPM_VERSION" >> $GITHUB_OUTPUT
          echo "npm_tag=$NPM_TAG" >> $GITHUB_OUTPUT
          echo "Pre-release version: $NPM_VERSION (tag: $NPM_TAG)"

      - name: Publish pre-release to Gitea npm registry
        run: |
          # set -o pipefail (#1247): without it, `npm publish ... | tee` returns
          # tee's exit code (always 0) and the || block below never fires, so
          # publish failures silently report success. Same fix in all four
          # publish steps.
          set -o pipefail
          cat > .npmrc << 'NPMRC'
          //git.integrolabs.net/api/packages/roctinam/npm/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          npm publish --registry=${{ env.GITEA_NPM_REGISTRY }} --tag ${{ steps.rcversion.outputs.npm_tag }} 2>&1 | tee publish-output.txt || {
            if grep -qE "package version already exists|EPUBLISHCONFLICT|409" publish-output.txt; then
              echo "✓ Pre-release version already published to Gitea"
            else
              echo "✗ Gitea pre-release publish failed (HTTP/npm error above)"
              cat publish-output.txt; exit 1
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Affirm dist-tag on Gitea (idempotent)
        # Always re-write the dist-tag, even when publish was skipped as
        # "already exists". This makes re-runs self-healing if the original
        # publish lost the tag write (registry race, propagation, etc).
        run: |
          set -o pipefail
          cat > .npmrc << 'NPMRC'
          //git.integrolabs.net/api/packages/roctinam/npm/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          VERSION="${{ steps.rcversion.outputs.npm_version }}"
          TAG="${{ steps.rcversion.outputs.npm_tag }}"
          for i in 1 2 3 4 5; do
            if npm dist-tag add "aiwg@${VERSION}" "${TAG}" --registry=${{ env.GITEA_NPM_REGISTRY }} 2>&1 | tee dist-tag-output.txt; then
              break
            fi
            if grep -qiE "is not in the npm registry|not found|404" dist-tag-output.txt; then
              echo "Attempt $i: version not yet visible on Gitea, retrying in 10s..."
              sleep 10
            else
              echo "✗ Gitea dist-tag promotion failed"; cat dist-tag-output.txt; exit 1
            fi
            if [ "$i" = "5" ]; then
              echo "✗ Gitea dist-tag promotion exhausted retries"; exit 1
            fi
          done
          echo "Gitea dist-tags after promotion:"
          npm dist-tag ls aiwg --registry=${{ env.GITEA_NPM_REGISTRY }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish pre-release to public npmjs.org
        run: |
          set -o pipefail
          cat > .npmrc << 'NPMRC'
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          npm publish --access public --tag ${{ steps.rcversion.outputs.npm_tag }} 2>&1 | tee publish-public-output.txt || {
            # 409/403/"cannot publish over" = "already published" (success).
            # 404 PUT = token/scope/ownership problem (failure — must surface,
            # see #1247). Anything else = unexpected (failure).
            if grep -qE "cannot publish over|EPUBLISHCONFLICT|409" publish-public-output.txt; then
              echo "✓ Pre-release version already published to npmjs.org"
            else
              echo "✗ Public npmjs.org pre-release publish failed (HTTP/npm error above)"
              echo "  Common causes: NPMJS_TOKEN missing scope on the aiwg package,"
              echo "  npmjs.org account ownership change, or token rotation needed."
              cat publish-public-output.txt; exit 1
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}

      - name: Affirm dist-tag on npmjs.org (idempotent)
        run: |
          set -o pipefail
          cat > .npmrc << 'NPMRC'
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          VERSION="${{ steps.rcversion.outputs.npm_version }}"
          TAG="${{ steps.rcversion.outputs.npm_tag }}"
          for i in 1 2 3 4 5; do
            if npm dist-tag add "aiwg@${VERSION}" "${TAG}" 2>&1 | tee dist-tag-output.txt; then
              break
            fi
            if grep -qiE "is not in the npm registry|not found|404" dist-tag-output.txt; then
              echo "Attempt $i: version not yet visible on npmjs.org, retrying in 10s..."
              sleep 10
            else
              echo "✗ npmjs.org dist-tag promotion failed"; cat dist-tag-output.txt; exit 1
            fi
            if [ "$i" = "5" ]; then
              echo "✗ npmjs.org dist-tag promotion exhausted retries"; exit 1
            fi
          done
          echo "npmjs.org dist-tags after promotion:"
          npm view aiwg dist-tags
          CURRENT=$(npm view "aiwg@${TAG}" version)
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "✗ Verification failed: aiwg@${TAG} resolves to ${CURRENT}, expected ${VERSION}"
            exit 1
          fi
          echo "✓ aiwg@${TAG} = ${VERSION} on npmjs.org"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}

  build-and-publish:
    name: Build and Publish
    # Only publish final tags (no pre-release suffix)
    if: ${{ !contains(github.ref, '-') }}
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # Needed so `git tag -v` can see the tag annotation (signature).
          fetch-tags: true

      - name: Verify signed tag (#1299 / A9 gate)
        # Hard gate: every release tag must verify against a maintainer
        # public key published in .gitea/keys/ or .gitea/allowed_signers.
        # See tools/ci/verify-signed-tag.sh for the full procedure and
        # docs/contributing/versioning.md for the operator setup.
        run: bash tools/ci/verify-signed-tag.sh

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        # Test failures must block stable publish. `continue-on-error: true`
        # removed per #1280 (A2). The CLI perf gate is included here under
        # parallel load — budgets in test/integration/cli-perf.test.ts
        # accommodate the parallel-load measurement. See #1302 for the
        # follow-up to investigate and tighten back toward isolated p50.
        run: npm test -- --run

      - name: Build TypeScript
        run: npm run build

      - name: Extract and verify version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "Error: Tag ($TAG_VERSION) does not match package.json ($VERSION)"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check package contents
        run: |
          echo "=== Package contents ==="
          npm pack --dry-run 2>&1 | tee pack-output.txt
          echo ""
          echo "=== Package size ==="
          SIZE=$(grep -oE 'package size:[[:space:]]*[0-9.]+[[:space:]]*[kMG]?B' pack-output.txt || echo "unknown")
          echo "Package size: $SIZE"

      - name: Verify .aiwg/ excluded from package
        run: |
          if grep -q '\.aiwg/' pack-output.txt; then
            echo "FATAL: .aiwg/ found in npm package contents!"
            echo ".aiwg/ is project-local SDLC artifacts — must never be published."
            grep '\.aiwg/' pack-output.txt
            exit 1
          fi
          echo "✓ .aiwg/ correctly excluded from npm package"

      - name: Publish to Gitea npm registry
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -o pipefail
          # Configure auth for Gitea registry
          cat > .npmrc << 'NPMRC'
          //git.integrolabs.net/api/packages/roctinam/npm/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC

          # Stable publishes deliberately omit `--tag` so npm's default
          # behavior is to set the `latest` dist-tag. The explicit
          # `npm dist-tag add ... latest` step below makes that promotion
          # mandatory and self-healing on re-runs — do not collapse them.
          # Allow re-runs: treat "version already exists" as success.
          npm publish --registry=${{ env.GITEA_NPM_REGISTRY }} 2>&1 | tee publish-output.txt || {
            if grep -qE "package version already exists|EPUBLISHCONFLICT|409" publish-output.txt; then
              echo "✓ Version already published to Gitea - treating as success"
            else
              echo "✗ Gitea publish failed"
              cat publish-output.txt
              exit 1
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Promote to latest on Gitea (idempotent)
        # Explicit dist-tag write. Runs even when publish was skipped as
        # "already exists" — this is the safety net that the user-reported
        # 2026.5.0 → latest miss exposed. See #1247 follow-up.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -o pipefail
          cat > .npmrc << 'NPMRC'
          //git.integrolabs.net/api/packages/roctinam/npm/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          VERSION="${{ steps.version.outputs.version }}"
          for i in 1 2 3 4 5; do
            if npm dist-tag add "aiwg@${VERSION}" latest --registry=${{ env.GITEA_NPM_REGISTRY }} 2>&1 | tee dist-tag-output.txt; then
              break
            fi
            if grep -qiE "is not in the npm registry|not found|404" dist-tag-output.txt; then
              echo "Attempt $i: version not yet visible on Gitea, retrying in 10s..."
              sleep 10
            else
              echo "✗ Gitea latest promotion failed"; cat dist-tag-output.txt; exit 1
            fi
            if [ "$i" = "5" ]; then
              echo "✗ Gitea latest promotion exhausted retries"; exit 1
            fi
          done
          echo "Gitea dist-tags after promotion:"
          npm dist-tag ls aiwg --registry=${{ env.GITEA_NPM_REGISTRY }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to public npmjs.org
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.skip_public != 'true' }}
        run: |
          set -o pipefail
          # Configure auth for public npm registry
          cat > .npmrc << 'NPMRC'
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC

          # Stable publish — npm's default behavior promotes `latest`, and the
          # next step re-affirms that explicitly for re-run safety.
          # Allow re-runs: treat "version already exists" as success.
          # 404 PUT is intentionally NOT swallowed (#1247) — it indicates
          # token scope / package ownership failure that must surface.
          npm publish --access public 2>&1 | tee publish-public-output.txt || {
            if grep -qE "cannot publish over the previously published|EPUBLISHCONFLICT|409" publish-public-output.txt; then
              echo "✓ Version already published to npmjs.org - treating as success"
            else
              echo "✗ Public npm publish failed (HTTP/npm error above)"
              echo "  Common causes: NPMJS_TOKEN missing scope on the aiwg package,"
              echo "  npmjs.org account ownership change, or token rotation needed."
              cat publish-public-output.txt
              exit 1
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}

      - name: Promote to latest on npmjs.org (idempotent + verified)
        # The fix that prevents the 2026.5.0 / 2026.3.3 latest-tag drift the
        # operator reported. Always writes `latest` after a stable publish,
        # then verifies via `npm view aiwg@latest version`. If verification
        # fails, the workflow fails — main must never be left red with a
        # stale `latest`.
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.skip_public != 'true' }}
        run: |
          set -o pipefail
          cat > .npmrc << 'NPMRC'
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          VERSION="${{ steps.version.outputs.version }}"
          for i in 1 2 3 4 5; do
            if npm dist-tag add "aiwg@${VERSION}" latest 2>&1 | tee dist-tag-output.txt; then
              break
            fi
            if grep -qiE "is not in the npm registry|not found|404" dist-tag-output.txt; then
              echo "Attempt $i: version not yet visible on npmjs.org, retrying in 10s..."
              sleep 10
            else
              echo "✗ npmjs.org latest promotion failed"; cat dist-tag-output.txt; exit 1
            fi
            if [ "$i" = "5" ]; then
              echo "✗ npmjs.org latest promotion exhausted retries"; exit 1
            fi
          done
          echo "npmjs.org dist-tags after promotion:"
          npm view aiwg dist-tags
          CURRENT_LATEST=$(npm view aiwg@latest version)
          if [ "$CURRENT_LATEST" != "$VERSION" ]; then
            echo "✗ Verification failed: aiwg@latest = ${CURRENT_LATEST}, expected ${VERSION}"
            exit 1
          fi
          echo "✓ aiwg@latest = ${VERSION} on npmjs.org"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}

      - name: Dry run - would publish
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "DRY RUN - Would publish version ${{ steps.version.outputs.version }}"
          echo "Registries: Gitea + npmjs.org"
          npm pack
          ls -la *.tgz

  verify-install:
    name: Verify Installation
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    needs: build-and-publish
    if: ${{ github.event.inputs.dry_run != 'true' }}
    timeout-minutes: 10

    steps:
      - name: Wait for package propagation
        run: sleep 15

      - name: Verify package on Gitea registry
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ env.GITEA_NPM_REGISTRY }}aiwg")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Package aiwg found in Gitea registry"
          else
            echo "⚠ Package not found in Gitea registry (HTTP $HTTP_CODE)"
          fi

      - name: Verify package on public npm
        if: ${{ github.event.inputs.skip_public != 'true' && github.event_name == 'push' }}
        run: |
          # Fail-loud verification: aiwg@latest on npmjs.org must equal the
          # version derived from the pushed tag. The prior implementation
          # only checked that *something* was returned, which let the
          # 2026.5.0 → 2026.3.3 latest-tag drift slip through. We derive
          # EXPECTED from the tag ref (not package.json) so this job does
          # not need to checkout the repo.
          EXPECTED="${GITHUB_REF#refs/tags/v}"
          LATEST=$(npm view aiwg@latest version 2>/dev/null || echo "unknown")
          echo "Latest version on npmjs.org: $LATEST (expected $EXPECTED)"
          if [ "$LATEST" = "unknown" ]; then
            echo "✗ Could not query npmjs.org dist-tags"
            exit 1
          fi
          if [ "$LATEST" != "$EXPECTED" ]; then
            echo "✗ aiwg@latest = $LATEST, expected $EXPECTED — latest promotion did not stick"
            exit 1
          fi
          echo "✓ Package aiwg@latest = $EXPECTED on npmjs.org"
