# Verify Hermes Source Citations
#
# Runs tools/verify-hermes-citations.mjs against the pinned Hermes
# version to catch documentation drift on PRs touching Hermes docs.
#
# @issues #1330 (S23)

name: Verify Hermes Citations

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/integrations/hermes-*.md'
      - 'docs/providers/hermes-*.md'
      - '.aiwg/research/parity/hermes/**'
      - 'tools/verify-hermes-citations.mjs'
      - '.gitea/workflows/hermes-citations.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/integrations/hermes-*.md'
      - 'docs/providers/hermes-*.md'
      - '.aiwg/research/parity/hermes/**'
      - 'tools/verify-hermes-citations.mjs'

concurrency:
  group: hermes-cite-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Hermes Citations
    runs-on: ubuntu-latest
    # Use the same container pin as the working ci.yml — Gitea Actions
    # runner expects a container that already has node+git available.
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
    timeout-minutes: 5
    steps:
      - name: Checkout AIWG
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Verify drift
        # Not --strict — drift in older research docs is informational.
        # Switch to --strict when the parity assessment refs are refreshed.
        run: node tools/verify-hermes-citations.mjs
