# A2A Conformance Release Gate
#
# Runs the standalone `roctinam/agentic-sandbox-conformance` harness against a
# reference agentic-sandbox v2 instance so each AIWG release provably
# interoperates with the executor contract.
#
# Trigger model
#   - release-candidate tags (vN.N.N-rc.M and stable vN.N.N) → blocks the
#     release pipeline.
#   - workflow_dispatch                                     → manual rerun
#     from the UI, with `sandbox_ref` and `conformance_ref` inputs for
#     pinned-ref retries.
#   - pull_request                                          → optional, opt-in
#     via the `conformance:full` PR label.
#
# We deliberately do NOT trigger on push-to-main: the upstream sandbox v2
# reference instance is still pre-release, so a green main branch shouldn't
# wait on a gate that can't pass yet. Once the sandbox ships v2 stable the
# `push: branches: [main]` line can be re-enabled — that is the only change
# required to flip this from "release-only" to "every-commit" gating.
#
# What this workflow does
#   1. Verifies the upstream prerequisites exist (sandbox repo has v2
#      compose, conformance repo exists). If either is missing the job
#      exits 0 with a notice so the gate reports "skipped" rather than
#      "failed" — this is the expected state pre-sandbox-v2.
#   2. Provisions an agentic-sandbox v2 instance via Docker Compose.
#   3. Waits for the executor to be healthy at /healthz.
#   4. Builds `roctinam/agentic-sandbox-conformance` from a pinned ref.
#   5. Executes the harness with markdown + JUnit reporters.
#   6. Uploads `report.md` and `report.junit.xml` as job artifacts.
#
# Closes #1258. Companion to roctinam/agentic-sandbox#221 (closed).

name: A2A Conformance

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sandbox_ref:
        description: 'agentic-sandbox git ref to provision (default: main)'
        required: false
        default: 'main'
      conformance_ref:
        description: 'agentic-sandbox-conformance git ref to build (default: main)'
        required: false
        default: 'main'

concurrency:
  group: conformance-${{ gitea.ref }}
  cancel-in-progress: true

env:
  # Pin the harness here so day-to-day CI is reproducible; bump deliberately
  # alongside an executor-contract version bump.
  SANDBOX_REF: ${{ github.event.inputs.sandbox_ref || 'main' }}
  CONFORMANCE_REF: ${{ github.event.inputs.conformance_ref || 'main' }}
  # The compose stack maps the executor to 127.0.0.1:8780. Override here if
  # the sandbox compose file changes its published port.
  EXECUTOR_URL: 'http://127.0.0.1:8780'
  # Conformance harness reads this from the env directly; the sandbox compose
  # stack auto-provisions a deterministic dev token when AIWG_DEV_MODE=1.
  EXECUTOR_TOKEN: 'aiwg-conformance-dev-token'
  # URL bases for the prerequisite probe + clone. Self-hosted Gitea origin.
  SANDBOX_REPO_URL: 'https://git.integrolabs.net/roctinam/agentic-sandbox'
  CONFORMANCE_REPO_URL: 'https://git.integrolabs.net/roctinam/agentic-sandbox-conformance'

jobs:
  graph-profile-fast:
    name: Graph Profile Fast Conformance
    runs-on: ubuntu-latest
    container:
      image: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2
    timeout-minutes: 10
    steps:
      - name: Checkout AIWG
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Install dependencies
        run: npm ci
      - name: Run graph profile fast conformance
        run: npm run test:conformance:graph

  conformance:
    name: A2A Conformance Harness
    runs-on: ubuntu-latest
    # node:20-bookworm has node pre-installed so JS-based actions (checkout@v4,
    # upload-artifact@v4) execute, and Debian package mirrors give us docker-cli
    # + go via apt without the docker:dind privileged-container gymnastics.
    # The runner mounts the host docker socket at /var/run/docker.sock so we
    # use DooD (Docker-outside-of-Docker) — no DinD, no --privileged.
    container:
      image: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 25

    # PRs only run the gate when explicitly opted in. Default PR run is a
    # noop status-check so PR latency stays bounded.
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'conformance:full')

    steps:
      # ── Phase 1: Upstream prerequisite probe ──────────────────────────
      # The sandbox v2 compose manifest and the conformance harness repo
      # don't exist yet in stable form. Until they do, the gate has nothing
      # to gate. Probe upstream cheaply with HTTP HEAD-equivalents; if
      # either is missing, skip-cleanly so the workflow turns green and
      # reports "prerequisite not yet available" instead of erroring.
      - name: Probe upstream prerequisites
        id: prereq
        shell: bash
        run: |
          set -uo pipefail

          # node:20-bookworm ships curl + git + ca-certificates + jq is the
          # only one we'd want later; apt-get install all of them once here.
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            curl ca-certificates jq git >/dev/null

          skip_reason=""

          # Probe 1: does the sandbox repo have docker-compose.yml at the
          # expected v2 path on the requested ref? Gitea's raw endpoint
          # returns 200 if present, 404 otherwise.
          compose_url="${SANDBOX_REPO_URL}/raw/branch/${SANDBOX_REF}/deploy/compose/v2/docker-compose.yml"
          compose_status=$(curl -s -o /dev/null -w '%{http_code}' "${compose_url}" || echo 000)
          if [ "${compose_status}" != "200" ]; then
            skip_reason+="sandbox v2 compose manifest not found at ${compose_url} (HTTP ${compose_status}); "
          fi

          # Probe 2: does the conformance harness repo exist?
          conf_status=$(curl -s -o /dev/null -w '%{http_code}' "${CONFORMANCE_REPO_URL}" || echo 000)
          if [ "${conf_status}" != "200" ]; then
            skip_reason+="conformance harness repo not reachable at ${CONFORMANCE_REPO_URL} (HTTP ${conf_status}); "
          fi

          if [ -n "${skip_reason}" ]; then
            echo "::notice::A2A conformance gate skipped — ${skip_reason}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout AIWG
        if: steps.prereq.outputs.skip != 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install docker + go
        if: steps.prereq.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Debian's docker.io package ships both docker CLI and compose v2
          # plugin (as docker-compose-v2). Go is from the bookworm-backports
          # repo; the stable bookworm `golang-go` is fine for the harness
          # build (Go 1.21+).
          apt-get install -y --no-install-recommends \
            docker.io docker-compose-v2 golang-go >/dev/null
          docker version --format '{{.Client.Version}}' || true
          go version

      - name: Verify host docker daemon is reachable (DooD)
        if: steps.prereq.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Host docker daemon not reachable. The runner must mount /var/run/docker.sock into job containers." >&2
            exit 1
          fi
          echo "docker info OK"

      - name: Checkout agentic-sandbox at ${{ env.SANDBOX_REF }}
        if: steps.prereq.outputs.skip != 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          repository: roctinam/agentic-sandbox
          ref: ${{ env.SANDBOX_REF }}
          path: agentic-sandbox

      - name: Provision agentic-sandbox v2 reference instance
        if: steps.prereq.outputs.skip != 'true'
        shell: bash
        env:
          AIWG_DEV_MODE: '1'
          AIWG_CONFORMANCE_TOKEN: ${{ env.EXECUTOR_TOKEN }}
        run: |
          set -euo pipefail
          docker compose -f agentic-sandbox/deploy/compose/v2/docker-compose.yml up -d --wait
          docker compose -f agentic-sandbox/deploy/compose/v2/docker-compose.yml ps

      - name: Wait for executor /healthz
        if: steps.prereq.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS "${EXECUTOR_URL}/healthz" >/dev/null 2>&1; then
              echo "executor healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::executor at ${EXECUTOR_URL} did not become healthy in 60s"
          docker compose -f agentic-sandbox/deploy/compose/v2/docker-compose.yml logs --tail=80 || true
          exit 1

      - name: Build conformance harness at ${{ env.CONFORMANCE_REF }}
        if: steps.prereq.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${CONFORMANCE_REF}" \
            "${CONFORMANCE_REPO_URL}.git" \
            agentic-sandbox-conformance
          cd agentic-sandbox-conformance
          go build -o /usr/local/bin/agentic-sandbox-conformance ./cmd/agentic-sandbox-conformance
          /usr/local/bin/agentic-sandbox-conformance --version || true

      - name: Run conformance harness
        if: steps.prereq.outputs.skip != 'true'
        id: harness
        shell: bash
        env:
          AIWG_EXECUTOR_URL: ${{ env.EXECUTOR_URL }}
          AIWG_EXECUTOR_TOKEN: ${{ env.EXECUTOR_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p conformance-out
          agentic-sandbox-conformance \
            --executor-url "${AIWG_EXECUTOR_URL}" \
            --token "${AIWG_EXECUTOR_TOKEN}" \
            --report-md conformance-out/report.md \
            --report-junit conformance-out/report.junit.xml \
            --log-level info \
            | tee conformance-out/run.log
          echo "harness_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Upload conformance reports
        if: always() && steps.prereq.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: conformance-reports-${{ github.run_number }}
          path: |
            conformance-out/report.md
            conformance-out/report.junit.xml
            conformance-out/run.log
          if-no-files-found: warn
          retention-days: 30

      - name: Dump sandbox logs on failure
        if: failure() && steps.prereq.outputs.skip != 'true'
        shell: bash
        run: |
          docker compose -f agentic-sandbox/deploy/compose/v2/docker-compose.yml \
            logs --tail=200 || true

      - name: Tear down agentic-sandbox
        if: always() && steps.prereq.outputs.skip != 'true'
        shell: bash
        run: |
          docker compose -f agentic-sandbox/deploy/compose/v2/docker-compose.yml down -v || true

      - name: Fail job if harness exit was non-zero
        if: steps.prereq.outputs.skip != 'true' && steps.harness.outcome == 'failure'
        run: |
          echo "::error::Conformance harness reported failures — see uploaded report.md"
          exit 1

      - name: Skip notice (upstream prerequisites not available)
        if: steps.prereq.outputs.skip == 'true'
        shell: bash
        run: |
          echo "::warning::A2A conformance gate skipped this run."
          echo "Reason: ${{ steps.prereq.outputs.skip_reason }}"
          echo "The gate will activate automatically once upstream sandbox v2 + conformance harness ship."
