# Gitea Release Creation
#
# Automatically creates (or reuses) a Gitea release when a version tag is pushed.
# Keeps GitHub release management manual via `gh release ...`.

name: Create Gitea Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 5
    # Force bash as the default shell — the gitea-runner-host's default is
    # `sh` (dash), which rejects `set -o pipefail` with "Illegal option"
    # (#1246/#1247 first attempt in rc.38 hit this). node:20 ships /bin/bash.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        # `git tag -v` finds the tag annotation/signature because the
        # tag ref is implicitly fetched on tag-push triggers
        # (refs/tags/X → refs/tags/X). Adding `fetch-tags: true` here
        # was a bug — actions/checkout@v4 then tries to fetch the same
        # ref twice and aborts with "Cannot fetch both <sha> and
        # refs/tags/<tag> to refs/tags/<tag>" (#1299 follow-up).

      - name: Verify signed tag (#1299 / A9 gate)
        # Hard gate: every release tag must verify against a maintainer
        # public key published in .gitea/keys/ or .gitea/allowed_signers.
        # Runs BEFORE the release-creation step so a bad signature never
        # produces a Gitea release record. See tools/ci/verify-signed-tag.sh
        # and docs/contributing/versioning.md.
        run: bash tools/ci/verify-signed-tag.sh

      - name: Install jq (node:20 image does not ship it by default)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends jq
          fi

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Error: Tag ($TAG_VERSION) does not match package.json ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version verified: $VERSION"

      # Authentication note (#1246, #1247):
      # `secrets.NPM_TOKEN` is a **Gitea API token** (gta_... format) —
      # NOT an npmjs.org token. Same token is used by npm-publish.yml to
      # auth against Gitea's bundled npm registry. The name is historical
      # and was kept in rc.38 by operator preference to avoid a secret-
      # rotation cycle. The npmjs.org public-registry token lives at
      # `secrets.NPMJS_TOKEN` and is referenced only by npm-publish.yml.
      - name: Create or reuse Gitea release
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          # Mark as prerelease if tag contains a suffix (RC, beta, alpha, etc.)
          BASE="${VERSION%%-*}"
          if [ "$VERSION" != "$BASE" ]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          # Build the release body via jq -n so the JSON is correctly escaped.
          # The previous inline `-d "{...\\\`\\\`\\\`...}"` form (#1246) mangled
          # the triple-backtick code-fence escaping at YAML expansion time and
          # Gitea responded with `"[]: json: string unexpected end of JSON
          # input"` — silently caught by `|| echo`, so no Release was ever
          # created from rc.27 through rc.37.
          #
          # Manual-approval record (#1286 / A10):
          # Gitea Actions ignores the `environment:` keyword (docs.gitea.com/
          # usage/actions/comparison) so there is no built-in deployment-
          # protection-rule gate. In a direct-mode delivery flow, the
          # tag push itself IS the approval moment — a signed tag (verified
          # one step above by A9's gate) constitutes the cryptographic
          # affirmation that the actor below intended this release. We
          # embed the actor + UTC timestamp into the release body so the
          # record is permanent, auditable, and survives token rotation.
          APPROVAL_ACTOR='${{ github.actor }}'
          APPROVAL_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY_MD=$(printf '## Installation\n\n```bash\nnpm install -g aiwg@%s\n```\n\nAlso available from Gitea registry:\n```bash\nnpm install -g aiwg@%s --registry=https://git.integrolabs.net/api/packages/roctinam/npm/\n```\n\n## Notes\n\nGitea release is auto-created on tag push. GitHub releases are managed manually.\n\n## Release approval record\n\n- Approved by: %s\n- Tag push (UTC): %s\n- Tag signature verified by: tools/ci/verify-signed-tag.sh (#1299 / A9)\n- Compensating-controls bundle: #1286 (A10)\n' "$VERSION" "$VERSION" "$APPROVAL_ACTOR" "$APPROVAL_TS")

          PAYLOAD=$(jq -n \
            --arg tag "v${VERSION}" \
            --arg body "$BODY_MD" \
            --argjson prerelease "$PRERELEASE" \
            '{tag_name: $tag, name: $tag, body: $body, draft: false, prerelease: $prerelease}')

          URL="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases"
          # POST and capture both response body + HTTP code so we can
          # distinguish "created" (201) from "already exists" (409) from
          # real failures (4xx/5xx without a 409). pipefail-safe.
          HTTP_CODE=$(curl -s -o /tmp/release-response.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.NPM_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$URL")

          case "$HTTP_CODE" in
            201|200)
              echo "Release created: v${VERSION}"
              ;;
            409)
              echo "Release v${VERSION} already exists — treating as success"
              ;;
            *)
              echo "Release creation failed (HTTP ${HTTP_CODE}):"
              cat /tmp/release-response.json
              exit 1
              ;;
          esac
