# Gitea Release Creation
#
# Automatically creates (or reuses) a Gitea release when a version tag is pushed.
# Keeps GitHub release management manual via `gh release ...`.
#
# Required tracker secrets: VAULT_CI_ROLE_ID, VAULT_CI_SECRET_ID.
# vault fetch spec: ci/vault-fetch.gitea-release.spec -> GITEA_TOKEN.

name: Create Gitea Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_to_publish:
        description: 'Existing signed release tag (for recovery reruns)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (see ci/digests.txt)
    timeout-minutes: 5
    # Force bash as the default shell — the gitea-runner-host's default is
    # `sh` (dash), which rejects `set -o pipefail` with "Illegal option"
    # (#1246/#1247 first attempt in rc.38 hit this). node:20 ships /bin/bash.
    defaults:
      run:
        shell: bash

    steps:
      - name: Require release bootstrap credentials
        # Check the materialized step environment. A missing credential must
        # fail release recovery visibly rather than skip the entire job.
        env:
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${VAULT_CI_ROLE_ID:-}" ] || [ -z "${VAULT_CI_SECRET_ID:-}" ]; then
            echo "Required release credentials unavailable: configure both VAULT_CI_ROLE_ID and VAULT_CI_SECRET_ID." >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Resolve release tag
        id: release_tag
        env:
          INPUT_TAG_TO_PUBLISH: ${{ github.event.inputs.tag_to_publish }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${INPUT_TAG_TO_PUBLISH:-}"
          else
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "Release tag must match vYYYY.M.PATCH[-pre]: ${RELEASE_TAG:-<empty>}"
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch tag object for signature verification
        # actions/checkout@v4 on tag-push uses --no-tags by default
        # and writes refs/tags/<tag> as a commit ref, not the tag
        # object. `git tag -v` then fails with "cannot verify a non-
        # tag object of type commit". Force-fetch the tag object
        # explicitly (`+` overwrites the commit-typed ref). See the
        # prerelease job in npm-publish.yml for the full post-mortem.
        run: |
          set -o pipefail
          TAG="${{ steps.release_tag.outputs.release_tag }}"
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}" --depth=1

      - name: Verify signed tag (#1299 / A9 gate)
        # Hard gate: every release tag must verify against a maintainer
        # public key published in .gitea/keys/ or .gitea/allowed_signers.
        # Runs BEFORE the release-creation step so a bad signature never
        # produces a Gitea release record. See tools/ci/verify-signed-tag.sh
        # and docs/contributing/versioning.md.
        env:
          AIWG_VERIFY_TAG_REF: refs/tags/${{ steps.release_tag.outputs.release_tag }}
        run: bash tools/ci/verify-signed-tag.sh

      - name: Checkout release tag
        run: git checkout --detach "refs/tags/${{ steps.release_tag.outputs.release_tag }}"

      - name: Verify source-bound storage benchmark claims (#2191)
        run: npm run verify:storage-claims

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION='${{ steps.release_tag.outputs.release_tag }}'
          TAG_VERSION=${TAG_VERSION#v}
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Error: Tag ($TAG_VERSION) does not match package.json ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version verified: $VERSION"

      - name: Install vault fetch dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl jq

      - name: Fetch Gitea release token from vault
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          GT_RELEASE_TOKEN_VAULT_PATH: ${{ vars.GT_RELEASE_TOKEN_VAULT_PATH }}
          GT_RELEASE_TOKEN_VAULT_FIELD: ${{ vars.GT_RELEASE_TOKEN_VAULT_FIELD }}
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: bash ci/vault-fetch.sh --spec ci/vault-fetch.gitea-release.spec

      - name: Create or reuse Gitea release
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          # Mark as prerelease if tag contains a suffix (RC, beta, alpha, etc.)
          BASE="${VERSION%%-*}"
          if [ "$VERSION" != "$BASE" ]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          # Build the release body via jq -n so the JSON is correctly escaped.
          # The previous inline `-d "{...\\\`\\\`\\\`...}"` form (#1246) mangled
          # the triple-backtick code-fence escaping at YAML expansion time and
          # Gitea responded with `"[]: json: string unexpected end of JSON
          # input"` — silently caught by `|| echo`, so no Release was ever
          # created from rc.27 through rc.37.
          #
          # Manual-approval record (#1286 / A10):
          # Gitea Actions ignores the `environment:` keyword (docs.gitea.com/
          # usage/actions/comparison) so there is no built-in deployment-
          # protection-rule gate. In a direct-mode delivery flow, the
          # tag push itself IS the approval moment — a signed tag (verified
          # one step above by A9's gate) constitutes the cryptographic
          # affirmation that the actor below intended this release. We
          # embed the actor + UTC timestamp into the release body so the
          # record is permanent, auditable, and survives token rotation.
          APPROVAL_ACTOR='${{ github.actor }}'
          APPROVAL_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY_MD=$(printf '## Installation\n\n```bash\nnpm install -g aiwg@%s\n```\n\nInstall the mirrored package tarball from Gitea while resolving third-party dependencies from npmjs.org:\n```bash\nnpm install -g https://git.integrolabs.net/api/packages/roctinam/npm/aiwg/-/%s/aiwg-%s.tgz\n```\n\nGitea bundled npm is a package store, not an npmjs proxy. Do not set it as the process-wide registry for the unscoped `aiwg` package.\n\n## Notes\n\nGitea release is auto-created on tag push. GitHub releases are managed manually.\n\n## Release approval record\n\n- Approved by: %s\n- Tag push (UTC): %s\n- Tag signature verified by: tools/ci/verify-signed-tag.sh (#1299 / A9)\n- Compensating-controls bundle: #1286 (A10)\n' "$VERSION" "$VERSION" "$VERSION" "$APPROVAL_ACTOR" "$APPROVAL_TS")

          PAYLOAD=$(jq -n \
            --arg tag "v${VERSION}" \
            --arg body "$BODY_MD" \
            --argjson prerelease "$PRERELEASE" \
            '{tag_name: $tag, name: $tag, body: $body, draft: false, prerelease: $prerelease}')

          URL="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases"
          # POST and capture both response body + HTTP code so we can
          # distinguish "created" (201) from "already exists" (409) from
          # real failures (4xx/5xx without a 409). pipefail-safe.
          HTTP_CODE=$(curl -s -o /tmp/release-response.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$URL")

          case "$HTTP_CODE" in
            201|200)
              echo "Release created: v${VERSION}"
              ;;
            409)
              echo "Release v${VERSION} already exists — treating as success"
              ;;
            *)
              echo "Release creation failed (HTTP ${HTTP_CODE}):"
              cat /tmp/release-response.json
              exit 1
              ;;
          esac
